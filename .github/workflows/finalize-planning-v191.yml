name: "Finalize planning v1.9.1"
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/finalize-planning-v191.yml"
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish V1.9.1
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('Démo fonctionnelle autonome SpeedArti Équipe & Planning v1.9','Démo fonctionnelle autonome SpeedArti Équipe & Planning v1.9.1')
          s=s.replace('<title>SpeedArti — Équipe & Planning v1.9</title>','<title>SpeedArti — Équipe & Planning v1.9.1</title>')
          s=s.replace("version: '1.9',","version: '1.9.1',",1)
          p.write_text(s,encoding='utf-8')
          PY
          rm -f .github/workflows/finalize-planning-v191.yml
          git config user.name "SpeedArti FORGE"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/finalize-planning-v191.yml
          git commit -m "V1.9.1 — interface simple et fluide"
          git push origin main
