name: Apply planning v1.7.1 fixes
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-planning-v171-fixes.yml'
permissions:
  contents: write
jobs:
  patch:
    if: contains(github.event.head_commit.message, 'Apply planning v1.7.1 fixes')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v1.6.1 corrections on top of v1.7
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Version visible / bridge
          s=s.replace('Démo fonctionnelle autonome SpeedArti Équipe & Planning v1.6','Démo fonctionnelle autonome SpeedArti Équipe & Planning v1.7.1')
          s=s.replace('<title>SpeedArti — Équipe & Planning v1.6</title>','<title>SpeedArti — Équipe & Planning v1.7.1</title>')
          s=s.replace("version: '1.6.0',","version: '1.7.1',",1)

          # Permissions individuelles et permissions par rôle ajoutées après le profil par défaut
          old_nav="""function navigationForMember(state, member) {
            const experience = experienceForMember(member);
            const ids = ROLE_NAVIGATION[experience] ?? ROLE_NAVIGATION.support;
            const labels = ROLE_NAV_LABELS[experience] ?? {};
            return NAV_ITEMS
              .filter(([id, , , permission]) => ids.includes(id) && can(state, permission))
              .map(([id, icon, label, permission]) => [id, icon, labels[id] ?? label, permission]);
          }"""
          new_nav="""function navigationForMember(state, member) {
            const experience = experienceForMember(member);
            const ids = ROLE_NAVIGATION[experience] ?? ROLE_NAVIGATION.support;
            const labels = ROLE_NAV_LABELS[experience] ?? {};
            const configuredRolePermissions = state.settings.rolePermissions[member?.role] ?? [];
            const defaultRolePermissions = DEFAULT_ROLE_PERMISSIONS[member?.role] ?? [];
            return NAV_ITEMS
              .filter(([id, , , permission]) => {
                if (!can(state, permission)) return false;
                if (ids.includes(id)) return true;
                const individualGrant = member?.permissionOverrides?.[permission] === true;
                const roleGrantBeyondDefault = configuredRolePermissions.includes(permission) && !defaultRolePermissions.includes(permission);
                return individualGrant || roleGrantBeyondDefault;
              })
              .map(([id, icon, label, permission]) => [id, icon, labels[id] ?? label, permission]);
          }"""
          if old_nav not in s:
              raise SystemExit('navigationForMember anchor not found')
          s=s.replace(old_nav,new_nav)

          # Même périmètre collaborateurs pour l'écran Équipe et la recherche globale
          anchor="""function visibleProjects(state) {
            return state.projects.filter((project) => isProjectVisibleToMember(state, project));
          }
          """
          helper="""function visibleProjects(state) {
            return state.projects.filter((project) => isProjectVisibleToMember(state, project));
          }

          function visibleMembersForTeamScope(state, member = getActiveMember(state)) {
            if (!member) return [];
            if (experienceForMember(member) !== 'team_lead') return state.members;
            const allowedIds = new Set([member.id]);
            for (const crew of state.crews.filter((item) => item.memberIds.includes(member.id))) {
              for (const memberId of crew.memberIds) allowedIds.add(memberId);
            }
            return state.members.filter((item) => allowedIds.has(item.id));
          }
          """
          if anchor not in s:
              raise SystemExit('visibleProjects anchor not found')
          s=s.replace(anchor,helper,1)

          old_search="const searchableMembers = can(state, PERMISSIONS.VIEW_TEAM) ? state.members : [activeMember].filter(Boolean);"
          new_search="const searchableMembers = can(state, PERMISSIONS.VIEW_TEAM) ? visibleMembersForTeamScope(state, activeMember) : [activeMember].filter(Boolean);"
          if old_search not in s:
              raise SystemExit('search scope anchor not found')
          s=s.replace(old_search,new_search,1)

          old_team="""    const ownCrewIds = new Set(state.crews.filter((crew) => crew.memberIds.includes(activeMember.id)).flatMap((crew) => crew.memberIds));
              ownCrewIds.add(activeMember.id);
              const displayedMembers = experience === 'team_lead' ? state.members.filter((member) => ownCrewIds.has(member.id)) : state.members;
              const displayedCrews = experience === 'team_lead' ? state.crews.filter((crew) => crew.memberIds.includes(activeMember.id)) : state.crews;"""
          new_team="""    const displayedMembers = visibleMembersForTeamScope(state, activeMember);
              const displayedCrews = experience === 'team_lead' ? state.crews.filter((crew) => crew.memberIds.includes(activeMember.id)) : state.crews;"""
          if old_team not in s:
              raise SystemExit('renderTeam scope anchor not found')
          s=s.replace(old_team,new_team,1)

          # Retirer l'ancienne interface Ángel locale ; le bridge global reste intact.
          s,n=re.subn(r"\n  renderAngel\(state\) \{.*?\n  \}\n\n  renderHistory\(state\) \{",
                      "\n  renderHistory(state) {",s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit('renderAngel block not found')

          s,n=re.subn(r"\n  askAngel\(question\) \{.*?\n  \}\n\n\n  generateSuggestions\(\) \{",
                      "\n  generateSuggestions() {",s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit('askAngel block not found')

          # Retirer la création autonome de chantier : Agenda Chantier reste la source unique.
          s,n=re.subn(r"\n  openProjectForm\(state, id = null\) \{.*?\n  \}\n\n  openAssignmentForm\(state, id = null\) \{",
                      "\n  openAssignmentForm(state, id = null) {",s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit('standalone project block not found')

          # Nettoyage des styles exclusivement liés à l'ancien écran Ángel local.
          s=re.sub(r"\n\.angel-layout \{.*?\.angel-composer textarea \{ min-height:76px; \}\n","\n",s,count=1,flags=re.S)
          s=s.replace("  .angel-layout { grid-template-columns:1fr; }\n","")
          s=s.replace("  .angel-composer { grid-template-columns:1fr; }\n","")

          # Garde-fous
          required=[
            'planning-v17-standard.js','planning-v17-expert.js','planning-v17-ultra.js','planning-v17-contracts.js',
            'function visibleMembersForTeamScope',
            'roleGrantBeyondDefault',
            'localAngelButton: false',
            'Source unique : Agenda Chantier SpeedArti'
          ]
          for token in required:
              if token not in s:
                  raise SystemExit(f'missing required token: {token}')
          forbidden=['renderAngel(state)','askAngel(question)','openProjectForm(state','saveProject(data)','deleteProject(id)','data-form="project"']
          for token in forbidden:
              if token in s:
                  raise SystemExit(f'forbidden dead code remains: {token}')

          p.write_text(s,encoding='utf-8')
          PY

          # Vérifier la syntaxe du gros script inline sans toucher aux extensions v1.7
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script>(.*?)</script>',s,re.S)
          if not blocks:
              raise SystemExit('inline script not found')
          Path('/tmp/index-inline.js').write_text(max(blocks,key=len),encoding='utf-8')
          PY
          node --check /tmp/index-inline.js
          node --check planning-v17-standard.js
          node --check planning-v17-expert.js
          node --check planning-v17-ultra.js
          node --check planning-v17-contracts.js

          rm -f .github/workflows/apply-planning-v171-fixes.yml
          git config user.name "SpeedArti FORGE"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/apply-planning-v171-fixes.yml
          git commit -m "V1.7.1 — réapplique les corrections v1.6.1 sur la v1.7"
          git push origin main
