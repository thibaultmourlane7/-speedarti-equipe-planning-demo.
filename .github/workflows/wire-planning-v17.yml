name: Wire planning v1.7 extensions
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wire-planning-v17.yml'
permissions:
  contents: write
jobs:
  wire:
    if: contains(github.event.head_commit.message, 'Wire planning v1.7')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Insert extension scripts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- SPEEDARTI_PLANNING_V17 -->'
          block='''\n  <!-- SPEEDARTI_PLANNING_V17 -->\n  <script src="planning-v17-contracts.js"></script>\n  <script src="planning-v17-standard.js"></script>\n  <script src="planning-v17-expert.js"></script>\n  <script src="planning-v17-ultra.js"></script>\n'''
          if marker not in s:
              s=s.replace('</body>', block+'\n</body>')
              p.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/wire-planning-v17.yml
          git config user.name "SpeedArti FORGE"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/wire-planning-v17.yml
          git commit -m "V1.7 — branche les extensions planning" || exit 0
          git push origin main
