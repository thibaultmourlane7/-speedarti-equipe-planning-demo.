name: "Finalize planning v1.8"
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/finalize-planning-v18.yml"
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish V1.8
        run: |
          sed -i 's/1\.7\.1/1.8/g' index.html
          rm -f .github/workflows/finalize-planning-v18.yml
          git config user.name "SpeedArti FORGE"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/finalize-planning-v18.yml
          git commit -m "V1.8 — cockpit Conducteur et suivi chantier"
          git push origin main
