name: "Check planning v1.9.4"
on:
  push:
    branches:
      - main
    paths:
      - "planning-v18-*.js"
      - "planning-v19-*.js"
      - "planning-v17-standard.js"
      - ".github/workflows/check-planning-v18.yml"
      - "tests/v18-core-smoke.js"
      - "tests/v181-client-transmission-smoke.js"
      - "tests/v19-gantt-smoke.js"
      - "tests/v19-angel-knowledge-smoke.js"
      - "tests/v191-ux-smoke.js"
      - "docs/ANGEL_KNOWLEDGE_ABSOLUTE_RULE.md"
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check planning-v19-gantt.js
          node --check planning-v19-ux-simple.js
          node --check planning-v18-core.js
          node --check planning-v18-conductor.js
          node --check planning-v18-field.js
          node --check planning-v18-client-transmission-core.js
          node --check planning-v18-client-transmission-ui.js
          node --check planning-v18-ai.js
          node --check planning-v18-contracts.js
          node --check planning-v17-standard.js
      - name: Check V1.8 feature contracts
        run: |
          grep -q "createMeeting" planning-v18-core.js
          grep -q "prepareDailyJournal" planning-v18-core.js
          grep -q "createChecklistTemplate" planning-v18-core.js
          grep -q "non_conformity" planning-v18-core.js
          grep -q "v18-plan-stage" planning-v18-conductor.js
          grep -q "Mon brief chantier" planning-v18-field.js
          grep -q "project-constraints" planning-v18-field.js
          grep -q "localAngelButton:false" planning-v18-ai.js
          grep -q "proposePhotoClassification" planning-v18-ai.js
          grep -q "temps_presence" planning-v18-contracts.js
          grep -q "external_calendar" planning-v18-contracts.js
          grep -q "planning-v18-core.js" sw-planning-v17.js
      - name: Run V1.8 core smoke test
        run: node tests/v18-core-smoke.js
      - name: Check V1.8.1 client transmission contracts
        run: |
          grep -q "share_with_client" planning-v18-client-transmission-core.js
          grep -q "ready_for_client_interface" planning-v18-client-transmission-core.js
          grep -q "Validation humaine explicite requise" planning-v18-client-transmission-core.js
          grep -q "Bordereau de transmission" planning-v18-client-transmission-ui.js
          grep -q "client_transmission_receipt" planning-v18-contracts.js
          grep -q "CLIENT_TRANSMISSION_KNOWLEDGE" planning-v18-ai.js
          grep -q "Aucun agent ne peut supprimer" docs/ANGEL_KNOWLEDGE_ABSOLUTE_RULE.md
      - name: Run V1.8.1 client transmission smoke test
        run: node tests/v181-client-transmission-smoke.js
      - name: Check V1.9 Gantt and Ángel knowledge
        run: |
          grep -q "scales:\['week','month','year','n3'\]" planning-v19-gantt.js
          grep -q "sourceOfTruth:'Agenda Chantier'" planning-v19-gantt.js
          grep -q "TEAM_PLANNING_KNOWLEDGE" planning-v18-ai.js
          grep -q "module:'equipe_planning'" planning-v18-ai.js
          grep -q "clientTransmission:CLIENT_TRANSMISSION_KNOWLEDGE" planning-v18-ai.js
          grep -q "planning-v19-gantt.js" planning-v17-standard.js
      - name: Run V1.9 Gantt smoke test
        run: node tests/v19-gantt-smoke.js
      - name: Run V1.9 Ángel knowledge smoke test
        run: node tests/v19-angel-knowledge-smoke.js
      - name: Check V1.9.4 simple UX
        run: |
          grep -q "sections:\['today','planning','projects','attention','gantt','reservations','nonconformities','quality','safety','meetings','journal','client'\]" planning-v19-ux-simple.js
          grep -q "Planning simple" planning-v19-ux-simple.js
          grep -q "Signaler quelque chose" planning-v19-ux-simple.js
          grep -q "Vue avancée → Gantt" planning-v19-ux-simple.js
          grep -q "Réserves / OPR" planning-v19-ux-simple.js
          grep -q "Journal chantier" planning-v19-ux-simple.js
          grep -q "Suivi client" planning-v19-ux-simple.js
          ! grep -q "\['more','•••','Plus'\]" planning-v19-ux-simple.js
          grep -q "navigationSimple" planning-v18-ai.js
          grep -q "equipe_planning@1.4.0" tests/v19-angel-knowledge-smoke.js
          grep -q "navGroups??={organisation:false,site:false,admin:false}" planning-v19-ux-simple.js
          grep -q "toggle-nav-group" planning-v19-ux-simple.js
          grep -q "v191-nav-group-fixed" planning-v19-ux-simple.js
          grep -q "@media(min-width:701px) and (max-width:1024px)" planning-v19-ux-simple.js
          grep -q "grid-template-columns:200px minmax(0,1fr)" planning-v19-ux-simple.js
          grep -q "position:sticky!important" planning-v19-ux-simple.js
          grep -q "@media(max-width:700px)" planning-v19-ux-simple.js
          grep -q "grid-template-columns:82px minmax(0,1fr)" planning-v19-ux-simple.js
          grep -q "position:fixed!important" planning-v19-ux-simple.js
      - name: Run V1.9.4 UX smoke test
        run: node tests/v191-ux-smoke.js
