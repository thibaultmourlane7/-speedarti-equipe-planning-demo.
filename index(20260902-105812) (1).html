function mergeById(current, incoming, defaults = {}) {
  const map = new Map(current.map((item) => [item.id, structuredClone(item)]));
  for (const item of incoming ?? []) map.set(item.id, { ...defaults, ...(map.get(item.id) ?? {}), ...structuredClone(item) });
  return [...map.values()];
}

class IntegrationHub extends EventTarget {
  constructor(store, options = {}) {
    super();
    this.store = store;
    this.outbox = options.outbox ?? new IntegrationOutbox(options.outboxRepository);
    this.connectors = { ...createPreparedConnectors(), ...(options.connectors ?? {}) };
    this.processedAuditIds = new Set();
    this.autoQueue = options.autoQueue ?? true;
    this.storeListener = (event) => this.onStoreChanged(event.detail);
    store.addEventListener('change', this.storeListener);
  }

  destroy() {
    this.store.removeEventListener('change', this.storeListener);
  }

  getCatalog() {
    return structuredClone(CONNECTION_CATALOG);
  }

  getStatus() {
    return Object.fromEntries(Object.entries(this.connectors).map(([name, connector]) => [name, connector.getStatus()]));
  }

  configureConnector(moduleName, options) {
    const connector = this.connectors[moduleName];
    if (!connector) throw new Error(`Connecteur inconnu : ${moduleName}.`);
    const status = connector.configure(options);
    this.dispatchEvent(new CustomEvent('status', { detail: this.getStatus() }));
    return status;
  }

  registerConnector(moduleName, connector) {
    if (!Object.values(SPEEDARTI_MODULES).includes(moduleName)) throw new Error(`Module inconnu : ${moduleName}.`);
    if (!connector || typeof connector.send !== 'function' || typeof connector.getStatus !== 'function') throw new Error('Connecteur invalide.');
    this.connectors[moduleName] = connector;
    return connector.getStatus();
  }

  queue(target, eventType, payload, metadata = {}) {
    const state = this.store.getState();
    const envelope = createIntegrationEnvelope({
      target,
      eventType,
      companyId: state.company.id,
      payload,
      correlationId: metadata.correlationId ?? null,
      idempotencyKey: metadata.idempotencyKey ?? null,
      metadata: { actorId: state.session.activeMemberId, ...metadata },
    });
    const item = this.outbox.enqueue(envelope);
    this.dispatchEvent(new CustomEvent('queued', { detail: item }));
    return item;
  }

  onStoreChanged(state) {
    if (!this.autoQueue) return;
    const newAudits = (state.audit ?? []).filter((audit) => !this.processedAuditIds.has(audit.id)).reverse();
    for (const audit of newAudits) {
      this.processedAuditIds.add(audit.id);
      const events = mapAuditToOutboundEvents(state, audit);
      for (const event of events) {
        this.queue(event.target, event.eventType, event.payload, {
          correlationId: audit.id,
          idempotencyKey: `${state.company.id}:${audit.id}:${event.target}:${event.eventType}`,
          auditAction: audit.action,
        });
      }
    }
  }

  async flush({ target = null } = {}) {
    const pending = this.outbox.getPending(target);
    const results = [];
    for (const item of pending) {
      const connector = this.connectors[item.envelope.target];
      if (!connector?.getStatus().ready) {
        results.push({ id: item.id, status: 'kept_pending', reason: 'connector_disabled' });
        continue;
      }
      this.outbox.markSending(item.id);
      try {
        const response = await connector.send(item.envelope);
        this.outbox.markSent(item.id, response);
        results.push({ id: item.id, status: 'sent', response });
      } catch (error) {
        this.outbox.markFailed(item.id, error);
        results.push({ id: item.id, status: 'failed', error: error instanceof Error ? error.message : String(error) });
      }
    }
    this.dispatchEvent(new CustomEvent('flushed', { detail: results }));
    return results;
  }


  requestStockAvailability(payload) {
    return this.queue(SPEEDARTI_MODULES.STOCK, 'team_planning.material.availability.requested', payload);
  }

  requestStockExitDraft(payload) {
    return this.queue(SPEEDARTI_MODULES.STOCK, 'team_planning.stock_exit.draft.requested', { ...payload, validationRequired: true });
  }

  requestOrderDraft(payload) {
    return this.queue(SPEEDARTI_MODULES.COMMANDES, 'team_planning.order.draft.requested', { ...payload, validationRequired: true });
  }

  reportAbsence(payload) {
    return this.queue(SPEEDARTI_MODULES.RH, 'team_planning.absence.reported', { ...payload, status: 'to_validate' });
  }

  requestReinforcement(payload) {
    return this.queue(SPEEDARTI_MODULES.SOUS_TRAITANCE, 'team_planning.reinforcement.requested', { ...payload, validationRequired: true });
  }

  requestDocumentUpload(payload) {
    return this.queue(SPEEDARTI_MODULES.DOCUMENTS, 'team_planning.document.upload.requested', payload);
  }

  requestAngel(payload) {
    return this.queue(SPEEDARTI_MODULES.ANGEL, 'team_planning.angel.context.requested', { ...payload, executeActions: false });
  }

  publishCurrentPlanning() {
    const state = this.store.getState();
    const payload = buildPlanningPublication(state);
    const queued = [
      this.queue(SPEEDARTI_MODULES.TEMPS_PRESENCE, 'team_planning.planning.published', payload, { idempotencyKey: `${state.company.id}:planning:${payload.generatedAt}:temps_presence` }),
      this.queue(SPEEDARTI_MODULES.AGENDA_CHANTIER, 'team_planning.assignments.snapshot', payload, { idempotencyKey: `${state.company.id}:planning:${payload.generatedAt}:agenda` }),
    ];
    return queued;
  }

  async receive(envelope) {
    assertIntegrationEnvelope(envelope);
    if (envelope.target !== 'equipe_planning') throw new Error('Cette enveloppe ne cible pas Équipe & Planning.');
    const handlers = {
      [INBOUND_EVENTS.IDENTITY_SNAPSHOT]: (payload) => this.applyIdentitySnapshot(payload),
      [INBOUND_EVENTS.ENTITLEMENTS_SNAPSHOT]: (payload) => this.applyEntitlementsSnapshot(payload),
      [INBOUND_EVENTS.AGENDA_SNAPSHOT]: (payload) => this.applyAgendaSnapshot(payload),
      [INBOUND_EVENTS.RH_SNAPSHOT]: (payload) => this.applyRhSnapshot(payload),
      [INBOUND_EVENTS.STOCK_AVAILABILITY_RESPONSE]: (payload) => this.applyRequestIntegrationResult(payload, 'stock'),
      [INBOUND_EVENTS.CATALOGUE_SEARCH_RESPONSE]: (payload) => this.applyRequestIntegrationResult(payload, 'catalogue'),
      [INBOUND_EVENTS.SUBCONTRACTING_CANDIDATES_RESPONSE]: (payload) => this.applyRequestIntegrationResult(payload, 'subcontracting'),
      [INBOUND_EVENTS.DOCUMENT_UPLOAD_RESPONSE]: (payload) => this.applyDocumentUploadResult(payload),
      [INBOUND_EVENTS.ANGEL_RESPONSE]: (payload) => this.applyAngelResponse(payload),
    };
    const handler = handlers[envelope.eventType];
    if (!handler) throw new Error(`Événement entrant non pris en charge : ${envelope.eventType}.`);
    const result = await handler(envelope.payload);
    this.dispatchEvent(new CustomEvent('received', { detail: envelope }));
    return result;
  }

  applyIdentitySnapshot(payload) {
    this.store.update((state) => {
      if (payload.company) state.company = { ...state.company, ...payload.company };
      if (payload.activeMemberId && state.members.some((member) => member.id === payload.activeMemberId)) state.session.activeMemberId = payload.activeMemberId;
      state.integration ??= {};
      state.integration.identitySyncedAt = nowIso();
    }, { action: 'integration.identity.received', entityType: 'integration', entityId: 'identity' });
    return { applied: true };
  }

  applyEntitlementsSnapshot(payload) {
    this.store.update((state) => {
      if (['standard', 'expert', 'ultra'].includes(payload.edition)) state.settings.edition = payload.edition;
      state.settings.entitlements = { ...(state.settings.entitlements ?? {}), ...payload };
      state.integration ??= {};
      state.integration.entitlementsSyncedAt = nowIso();
    }, { action: 'integration.entitlements.received', entityType: 'integration', entityId: 'entitlements' });
    return { applied: true };
  }

  applyAgendaSnapshot(payload) {
    this.store.update((state) => {
      state.projects = mergeById(state.projects, payload.projects, { source: 'agenda_chantier' });
      const incoming = payload.assignments ?? [];
      for (const item of incoming) {
        const index = state.assignments.findIndex((assignment) => assignment.id === item.id || (item.calendarEventId && assignment.calendarEventId === item.calendarEventId));
        if (index >= 0) {
          const local = state.assignments[index];
          state.assignments[index] = {
            ...local,
            ...item,
            source: 'agenda_chantier',
            memberIds: local.memberIds ?? [],
            crewIds: local.crewIds ?? [],
            notes: local.notes ?? '',
          };
        } else {
          state.assignments.push({ memberIds: [], crewIds: [], notes: '', source: 'agenda_chantier', ...item });
        }
      }
      state.integration ??= {};
      state.integration.agendaSyncedAt = nowIso();
    }, { action: 'integration.agenda.received', entityType: 'integration', entityId: 'agenda', details: `${payload.projects?.length ?? 0} chantier(s), ${payload.assignments?.length ?? 0} intervention(s)` });
    return { applied: true };
  }

  applyRhSnapshot(payload) {
    this.store.update((state) => {
      for (const incoming of payload.members ?? []) {
        const index = state.members.findIndex((member) => member.id === incoming.id);
        const defaults = { permissionOverrides: {}, projectAccessMode: 'role', projectAccessIds: [], skills: [], status: 'active', availability: { weeklyHours: 35, workingDays: [1, 2, 3, 4, 5], unavailablePeriods: [] } };
        if (index >= 0) {
          const local = state.members[index];
          state.members[index] = {
            ...defaults,
            ...local,
            ...incoming,
            skills: incoming.skills ?? local.skills ?? [],
            permissionOverrides: local.permissionOverrides ?? {},
            projectAccessMode: local.projectAccessMode ?? 'role',
            projectAccessIds: local.projectAccessIds ?? [],
            availability: {
              ...(local.availability ?? defaults.availability),
              ...(incoming.availability ?? {}),
              unavailablePeriods: incoming.availability?.unavailablePeriods ?? local.availability?.unavailablePeriods ?? [],
            },
          };
        } else state.members.push({ ...defaults, ...incoming });
      }
      state.integration ??= {};
      state.integration.rhSyncedAt = nowIso();
    }, { action: 'integration.rh.received', entityType: 'integration', entityId: 'rh', details: `${payload.members?.length ?? 0} profil(s)` });
    return { applied: true };
  }

  applyRequestIntegrationResult(payload, key) {
    this.store.update((state) => {
      const request = state.requests.find((item) => item.id === payload.requestId);
      if (!request) throw new Error('Demande terrain introuvable.');
      request.integration ??= {};
      request.integration[key] = { ...payload, receivedAt: nowIso() };
    }, { action: `integration.${key}.received`, entityType: 'request', entityId: payload.requestId });
    return { applied: true };
  }

  applyDocumentUploadResult(payload) {
    this.store.update((state) => {
      const collections = [state.reports, state.requests, state.messages];
      for (const collection of collections) {
        const entity = collection.find((item) => item.id === payload.entityId);
        const attachment = entity?.attachments?.find((item) => item.id === payload.attachmentId);
        if (attachment) Object.assign(attachment, { remoteId: payload.remoteId, remoteUrl: payload.remoteUrl, uploadStatus: 'uploaded' });
      }
    }, { action: 'integration.document.received', entityType: payload.entityType ?? 'document', entityId: payload.entityId });
    return { applied: true };
  }

  applyAngelResponse(payload) {
    this.store.update((state) => {
      state.angelConversations.unshift({
        id: uid('angel_remote'),
        question: payload.question ?? '',
        response: payload.response ?? payload,
        createdAt: nowIso(),
        authorId: state.session.activeMemberId,
        source: 'angel_speedarti',
        actionsRequireValidation: true,
      });
    }, { action: 'integration.angel.received', entityType: 'angel', entityId: payload.requestId ?? 'response' });
    return { applied: true };
  }

  exportPreparationBundle() {
    return {
      generatedAt: nowIso(),
      moduleVersion: '1.3.0',
      catalog: this.getCatalog(),
      status: this.getStatus(),
      outbox: this.outbox.list(),
      snapshot: this.store.getState(),
    };
  }
}

/**
 * Pont public du module autonome.
 *
 * Trois modes de raccord sont pris en charge :
 * 1. même fenêtre : window.SpeedArtiTeamPlanning ;
 * 2. iframe : messages postMessage avec source "speedarti" ;
 * 3. événements DOM : speedarti:team-planning:*.
 */
function installIntegrationBridge(store, providedHub = null) {
  const hub = providedHub ?? new IntegrationHub(store);
  const configuredParentOrigin = new URLSearchParams(window.location.search).get('parentOrigin');
  const parentOrigin = configuredParentOrigin || window.location.origin;

  const publishToParent = (type, payload) => {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ source: 'speedarti-team-planning', type, payload }, parentOrigin);
    }
  };

  const bridge = {
    version: '1.4.0',
    getSnapshot: () => store.getState(),
    exportJson: () => store.exportJson(),
    importJson: (raw) => store.importJson(raw),
    setActiveMember: (memberId) => store.update((state) => {
      if (!state.members.some((member) => member.id === memberId)) throw new Error('Collaborateur inconnu.');
      state.session.activeMemberId = memberId;
    }, { action: 'session.member.changed', entityType: 'member', entityId: memberId }),
    syncProjects: (projects) => store.update((state) => {
      for (const incoming of projects) {
        const index = state.projects.findIndex((project) => project.id === incoming.id);
        const normalized = { ...incoming, source: 'speedarti' };
        if (index >= 0) state.projects[index] = { ...state.projects[index], ...normalized };
        else state.projects.push(normalized);
      }
    }, { action: 'integration.projects.synced', entityType: 'project', entityId: 'batch', details: `${projects.length} chantier(s)` }),
    syncAgenda: ({ projects = [], assignments = [] }) => store.update((state) => {
      for (const incoming of projects) {
        const index = state.projects.findIndex((project) => project.id === incoming.id);
        const normalized = { ...incoming, source: 'speedarti' };
        if (index >= 0) state.projects[index] = { ...state.projects[index], ...normalized };
        else state.projects.push(normalized);
      }
      for (const incoming of assignments) {
        const index = state.assignments.findIndex((assignment) => assignment.id === incoming.id || (incoming.calendarEventId && assignment.calendarEventId === incoming.calendarEventId));
        const normalized = { memberIds: [], crewIds: [], notes: '', ...incoming, source: 'speedarti' };
        if (index >= 0) {
          const existing = state.assignments[index];
          state.assignments[index] = { ...existing, ...normalized, memberIds: existing.memberIds ?? [], crewIds: existing.crewIds ?? [], notes: existing.notes ?? '' };
        } else state.assignments.push(normalized);
      }
    }, { action: 'integration.agenda.synced', entityType: 'assignment', entityId: 'batch', details: `${projects.length} chantier(s), ${assignments.length} intervention(s)` }),
    onChange: (callback) => {
      const listener = (event) => callback(event.detail);
      store.addEventListener('change', listener);
      return () => store.removeEventListener('change', listener);
    },
    integrations: {
      getCatalog: () => hub.getCatalog(),
      getStatus: () => hub.getStatus(),
      getOutbox: (filters = {}) => hub.outbox.list(filters),
      configureConnector: (moduleName, options) => hub.configureConnector(moduleName, options),
      registerConnector: (moduleName, connector) => hub.registerConnector(moduleName, connector),
      flush: (options = {}) => hub.flush(options),
      publishCurrentPlanning: () => hub.publishCurrentPlanning(),
      requestStockAvailability: (payload) => hub.requestStockAvailability(payload),
      requestStockExitDraft: (payload) => hub.requestStockExitDraft(payload),
      requestOrderDraft: (payload) => hub.requestOrderDraft(payload),
      reportAbsence: (payload) => hub.reportAbsence(payload),
      requestReinforcement: (payload) => hub.requestReinforcement(payload),
      requestDocumentUpload: (payload) => hub.requestDocumentUpload(payload),
      getLocalAttachmentForUpload: (attachmentId) => getAttachment(attachmentId),
      requestAngel: (payload) => hub.requestAngel(payload),
      getAngelContext: (question = '') => {
        const state = store.getState();
        const clean = String(question || '').trim();
        return {
          module: 'equipe_planning',
          version: bridge.version,
          companyId: state.company.id,
          question: clean,
          localAnswer: clean ? answerTeamQuestion(state, clean) : null,
          summary: {
            activeMembers: state.members.filter((member) => member.status === 'active').length,
            assignments: state.assignments.length,
            openRequests: state.requests.filter((request) => request.status !== 'resolved').length,
            missingReports: findMissingReports(state).length,
            capacity: buildCapacityOverview(state).map((item) => ({ memberId: item.memberId, loadPct: item.loadPct, status: item.status })),
          },
          policy: {
            userEntryPointOwnedBy: 'speedarti_global_angel',
            localAngelButton: false,
            executeActions: false,
            authorizedTeamDataOnly: true,
          },
        };
      },
      answerAngelLocally: (question) => answerTeamQuestion(store.getState(), question),
      receive: (envelope) => hub.receive(envelope),
      createInboundEnvelope: ({ eventType, source, payload, idempotencyKey }) => createIntegrationEnvelope({
        eventType,
        source,
        target: 'equipe_planning',
        companyId: store.getState().company.id,
        payload,
        idempotencyKey,
      }),
      exportPreparationBundle: () => hub.exportPreparationBundle(),
    },
  };

  window.SpeedArtiTeamPlanning = bridge;

  store.addEventListener('change', (event) => {
    publishToParent('team-planning:changed', event.detail);
  });

  window.addEventListener('message', (event) => {
    const message = event.data;
    if (!message || message.source !== 'speedarti') return;
    if (event.origin !== parentOrigin) return;
    try {
      if (message.type === 'team-planning:sync-projects') bridge.syncProjects(message.payload ?? []);
      if (message.type === 'team-planning:sync-agenda') bridge.syncAgenda(message.payload ?? {});
      if (message.type === 'team-planning:set-active-member') bridge.setActiveMember(message.payload?.memberId);
      if (message.type === 'team-planning:get-snapshot') {
        event.source?.postMessage({ source: 'speedarti-team-planning', type: 'team-planning:snapshot', requestId: message.requestId, payload: bridge.getSnapshot() }, event.origin);
      }
      if (message.type === 'team-planning:integration:receive') bridge.integrations.receive(message.payload);
      if (message.type === 'team-planning:angel-context') {
        event.source?.postMessage({ source: 'speedarti-team-planning', type: 'team-planning:angel-context', requestId: message.requestId, payload: bridge.integrations.getAngelContext(message.payload?.question ?? '') }, event.origin);
      }
      if (message.type === 'team-planning:integration:status') {
        event.source?.postMessage({ source: 'speedarti-team-planning', type: 'team-planning:integration:status', requestId: message.requestId, payload: bridge.integrations.getStatus() }, event.origin);
      }
      if (message.type === 'team-planning:integration:flush') bridge.integrations.flush(message.payload ?? {});
    } catch (error) {
      publishToParent('team-planning:error', { message: error instanceof Error ? error.message : String(error), requestId: message.requestId });
    }
  });

  const ready = { version: bridge.version };
  window.dispatchEvent(new CustomEvent('speedarti:team-planning:ready', { detail: ready }));
  publishToParent('team-planning:ready', ready);
  bridge.integrationHub = hub;
  return bridge;
}

  review_progress: "Créer une tâche de suivi",
  create_absence_request: "Créer l’alerte d’absence",
  prepare_reorganization: "Préparer la réorganisation",
  create_delay_task: "Créer la tâche de retard",
};

function optionList(dictionary, selected) {
  return Object.entries(dictionary)
    .map(([value, label]) => `<option value="${escapeHtml(value)}" ${value === selected ? 'selected' : ''}>${escapeHtml(label)}</option>`)
    .join('');
}

function memberName(state, id) {
  return state.members.find((member) => member.id === id)?.name ?? 'Collaborateur supprimé';
}

function projectName(state, id) {
  return state.projects.find((project) => project.id === id)?.name ?? 'Chantier supprimé';
}

function badge(text, variant = 'neutral') {
  return `<span class="badge badge-${variant}">${escapeHtml(text)}</span>`;
}

function priorityBadge(priority) {
  const variants = { low: 'neutral', normal: 'info', high: 'warning', urgent: 'danger' };
  return badge(PRIORITIES[priority] ?? priority, variants[priority] ?? 'neutral');
}

function attachmentMarkup(state, attachment) {
  if (typeof attachment === 'string') return badge(`📎 ${attachment}`, 'neutral');
  const size = attachment.size ? ` · ${Math.max(1, Math.round(attachment.size / 1024))} Ko` : '';
  const allowed = can(state, PERMISSIONS.DOWNLOAD_ATTACHMENTS);
  return `<button class="attachment-button" data-action="download-attachment" data-id="${escapeHtml(attachment.id)}" ${allowed ? '' : 'disabled title="Téléchargement non autorisé"'}>📎 ${escapeHtml(attachment.name)}${escapeHtml(size)}</button>`;
}

function statusBadge(status) {
  const labels = {
    active: 'Actif', inactive: 'Inactif', planned: 'Planifié', in_progress: 'En cours', completed: 'Terminé',
    open: 'Ouverte', acknowledged: 'Prise en compte', resolved: 'Résolue', submitted: 'Transmis', draft: 'Brouillon',
    preparation: 'À préparer', suspended: 'Suspendu', invoiced: 'Facturé', archived: 'Archivé', pending: 'En attente', approved: 'Validée', rejected: 'Refusée',
  };
  const variants = { active: 'success', completed: 'success', resolved: 'success', approved: 'success', urgent: 'danger', suspended: 'danger', in_progress: 'info', planned: 'info', open: 'warning', pending: 'warning', acknowledged: 'info', inactive: 'neutral', rejected: 'neutral' };
  return badge(labels[status] ?? PROJECT_STATUSES[status] ?? status, variants[status] ?? 'neutral');
}

function toLocalDateTime(iso) {
  if (!iso) return '';
  const date = new Date(iso);
  const local = new Date(date.getTime() - date.getTimezoneOffset() * 60000);
  return local.toISOString().slice(0, 16);
}

function visibleProjects(state) {
  return state.projects.filter((project) => isProjectVisibleToMember(state, project));
}

class TeamPlanningUI {
  constructor(root, store) {
    this.root = root;
    this.store = store;
    this.view = this.viewFromLocation() || 'dashboard';
    this.modal = null;
    this.toast = null;
    this.messageProjectFilter = 'all';
    this.terrainProjectFilter = 'all';
    this.auditFilter = 'all';
    this.searchQuery = '';
    this.boundChange = () => this.render();
    this.boundPopState = () => {
      const nextView = this.viewFromLocation() || 'dashboard';
      if (nextView !== this.view) {
        this.view = nextView;
        this.modal = null;
        this.render();
      }
    };
  }

  mount() {
    this.store.addEventListener('change', this.boundChange);
    this.root.addEventListener('click', (event) => this.handleClick(event));
    this.root.addEventListener('change', (event) => this.handleChange(event));
    this.root.addEventListener('submit', (event) => this.handleSubmit(event));
    window.addEventListener('popstate', this.boundPopState);
    const initial = this.viewFromLocation() || 'dashboard';
    this.view = initial;
    if (window.history?.replaceState) window.history.replaceState({ teamPlanningView: initial }, '', `#${initial}`);
    this.render();
  }

  viewFromLocation() {
    if (typeof window === 'undefined' || !window.location) return null;
    const candidate = String(window.location.hash || '').replace(/^#/, '');
    const allowed = new Set([...NAV_ITEMS.map(([id]) => id), ...Object.keys(HIDDEN_VIEWS)]);
    return allowed.has(candidate) ? candidate : null;
  }

  navigate(view, { replace = false } = {}) {
    const allowed = new Set([...NAV_ITEMS.map(([id]) => id), ...Object.keys(HIDDEN_VIEWS)]);
    if (!allowed.has(view)) view = 'dashboard';
    this.view = view;
    this.modal = null;
    this.searchQuery = '';
    if (typeof window !== 'undefined' && window.history) {
      const method = replace ? 'replaceState' : 'pushState';
      window.history[method]?.({ teamPlanningView: view }, '', `#${view}`);
    }
    this.render();
    if (typeof window !== 'undefined') window.scrollTo?.({ top: 0, behavior: 'smooth' });
  }

  goBack() {
    if (this.view === 'dashboard') return;
    if (typeof window !== 'undefined' && window.history?.length > 1) window.history.back();
    else this.navigate('dashboard', { replace: true });
  }

  notify(message, type = 'success') {
    this.toast = { message, type };
    this.render();
    clearTimeout(this.toastTimer);
    this.toastTimer = setTimeout(() => {
      this.toast = null;
      this.render();
    }, 2800);
  }

  render() {
    const state = this.store.getState();
    const member = getActiveMember(state);
    if (!member) {
      this.root.innerHTML = '<main class="fatal">Aucun utilisateur disponible.</main>';
      return;
    }
    const allowedViews = NAV_ITEMS.filter(([, , , permission]) => can(state, permission));
    const hiddenAllowed = Object.prototype.hasOwnProperty.call(HIDDEN_VIEWS, this.view) && can(state, HIDDEN_VIEWS[this.view]);
    if (!allowedViews.some(([id]) => id === this.view) && !hiddenAllowed) this.view = allowedViews[0]?.[0] ?? 'dashboard';
    const unread = state.notifications.filter((notification) => !notification.read).length;

    this.root.innerHTML = `
      <div class="app-shell">
        <aside class="sidebar">
          <div class="brand"><span class="brand-mark">S</span><div><strong>SpeedArti</strong><small>Équipe & Planning</small></div></div>
          <nav aria-label="Navigation Équipe & Planning">${allowedViews.map(([id, icon, label]) => `
            <button class="nav-item ${this.view === id ? 'active' : ''}" data-view="${id}" aria-current="${this.view === id ? 'page' : 'false'}">
              <span class="nav-icon">${icon}</span><span>${label}</span>${id === 'pilotage' && unread ? `<em>${unread}</em>` : ''}
            </button>`).join('')}</nav>
          <div class="scope-note"><strong>Module autonome</strong><span>Le pointage n’est pas inclus.</span></div>
        </aside>
        <section class="workspace">
          <header class="topbar">
            <div class="topbar-leading">
              ${this.view !== 'dashboard' ? '<button class="back-button" data-action="go-back" aria-label="Revenir en arrière">←</button>' : ''}
              <div><h1>${this.pageTitle()}</h1><p>${escapeHtml(state.company.name)}</p></div>
            </div>
            <div class="topbar-actions">
              <form class="global-search" data-form="global-search" role="search">
                <label><span>Rechercher</span><input name="query" value="${escapeHtml(this.searchQuery)}" placeholder="Chantier, collaborateur, message…" autocomplete="off"/></label>
                <button class="search-submit" type="submit" aria-label="Lancer la recherche">⌕</button>
              </form>
              ${badge(EDITION_LABELS[state.settings.edition], state.settings.edition === 'ultra' ? 'purple' : state.settings.edition === 'expert' ? 'info' : 'neutral')}
              <button class="more-button" data-action="open-more-menu" aria-label="Plus d’options">⋯</button>
              <label class="user-switcher"><span>Utilisateur</span><select data-control="active-member">${state.members.filter((item) => item.status === 'active').map((item) => `<option value="${item.id}" ${item.id === member.id ? 'selected' : ''}>${escapeHtml(item.name)} — ${escapeHtml(ROLES[item.role])}</option>`).join('')}</select></label>
            </div>
          </header>
          <main class="content">${this.renderSearchResults(state)}${this.renderView(state)}</main>
        </section>
      </div>
      ${this.modal ? `<div class="modal-backdrop" data-modal-backdrop><section class="modal" role="dialog" aria-modal="true"><button class="modal-close" data-action="close-modal" aria-label="Fermer">×</button>${this.modal}</section></div>` : ''}
      ${this.toast ? `<div class="toast toast-${this.toast.type}" role="status">${escapeHtml(this.toast.message)}</div>` : ''}
    `;
  }

  pageTitle() {
    return {
      dashboard: 'Accueil', planning: 'Affectations Agenda Chantier', team: 'Équipe', terrain: 'Terrain', pilotage: 'Pilotage',
      history: 'Historique et traçabilité', settings: 'Configuration',
    }[this.view] ?? 'Équipe & Planning';
  }

  renderView(state) {
    switch (this.view) {
      case 'planning': return this.renderPlanning(state);
      case 'team': return this.renderTeam(state);
      case 'terrain': return this.renderTerrain(state);
      case 'pilotage': return this.renderPilotage(state);
      case 'history': return this.renderHistory(state);
      case 'settings': return this.renderSettings(state);
      default: return this.renderDashboard(state);
    }
  }

  renderSearchResults(state) {
    const query = this.searchQuery.trim().toLocaleLowerCase('fr-FR');
    if (query.length < 2) return '';
    const results = [];
    for (const member of state.members) {
      const haystack = [member.name, member.email, ROLES[member.role], ...(member.skills ?? [])].join(' ').toLocaleLowerCase('fr-FR');
      if (haystack.includes(query)) results.push({ kind: 'member', id: member.id, title: member.name, detail: `${ROLES[member.role]} · ${(member.skills ?? []).join(', ') || 'Aucune compétence'}` });
    }
    for (const project of visibleProjects(state)) {
      const haystack = [project.name, project.client, project.address, project.notes].join(' ').toLocaleLowerCase('fr-FR');
      if (haystack.includes(query)) results.push({ kind: 'project', id: project.id, projectId: project.id, title: project.name, detail: `${project.client || ''} · ${project.address || ''}` });
    }
    for (const assignment of state.assignments) {
      if (assignment.title.toLocaleLowerCase('fr-FR').includes(query)) results.push({ kind: 'assignment', id: assignment.id, projectId: assignment.projectId, title: assignment.title, detail: `${projectName(state, assignment.projectId)} · ${formatDateTime(assignment.start)}` });
    }
    for (const message of state.messages) {
      if (message.body.toLocaleLowerCase('fr-FR').includes(query)) results.push({ kind: 'message', id: message.id, projectId: message.projectId, title: `Message de ${memberName(state, message.authorId)}`, detail: message.body });
    }
    const limited = results.slice(0, 12);
    return `<section class="search-results panel"><div class="panel-header"><div><h2>Résultats pour « ${escapeHtml(this.searchQuery)} »</h2><p>${limited.length} résultat(s) affiché(s).</p></div><button class="ghost" data-action="clear-search">Fermer</button></div>${limited.length ? `<div class="search-result-list">${limited.map((item) => `<button class="search-result" data-action="open-search-result" data-kind="${item.kind}" data-id="${item.id}" data-project-id="${item.projectId || ''}"><strong>${escapeHtml(item.title)}</strong><small>${escapeHtml(item.detail)}</small></button>`).join('')}</div>` : this.empty('Aucun résultat.')}</section>`;
  }

  renderDashboard(state) {
    const activeProjects = visibleProjects(state).filter((project) => !['completed', 'invoiced', 'archived'].includes(project.status));
    const openRequests = state.requests.filter((request) => request.status !== 'resolved');
    const unread = state.notifications.filter((notification) => !notification.read);
    const openTasks = state.tasks.filter((task) => task.status !== 'completed' && (task.assigneeId === state.session.activeMemberId || can(state, PERMISSIONS.VIEW_ALL_PROJECTS)));
    const missing = findMissingReports(state);
    const risks = assignmentAvailabilityRisks(state);
    const unassigned = state.assignments.filter((assignment) => new Date(assignment.end) >= new Date() && resolveAssignmentMembers(state, assignment).length === 0);
    const urgentRequests = openRequests.filter((request) => ['high', 'urgent'].includes(request.priority));
    const upcoming = state.assignments.filter((assignment) => new Date(assignment.end) >= new Date()).sort((a, b) => new Date(a.start) - new Date(b.start)).slice(0, 4);
    const attention = [
      { count: unassigned.length, title: 'Interventions sans équipe', detail: 'Affectations à compléter', view: 'planning', tone: unassigned.length ? 'warning' : 'success' },
      { count: missing.length, title: 'Rapports manquants', detail: 'Rapports terrain attendus', view: 'pilotage', tone: missing.length ? 'warning' : 'success' },
      { count: urgentRequests.length, title: 'Alertes terrain', detail: 'Demandes hautes ou urgentes', view: 'terrain', tone: urgentRequests.length ? 'danger' : 'success' },
      { count: risks.length, title: 'Risques de disponibilité', detail: 'Affectations à vérifier', view: 'pilotage', tone: risks.length ? 'warning' : 'success' },
    ];

    return `
      <section class="welcome-strip"><div><span class="eyebrow">Aujourd’hui</span><h2>Ce qui demande votre attention</h2><p>Les informations essentielles, sans chercher dans plusieurs menus.</p></div><span class="today-date">${formatDate(nowIso())}</span></section>
      <section class="attention-grid">${attention.map((item) => `<button class="attention-card attention-${item.tone}" data-view="${item.view}"><strong>${item.count}</strong><span>${escapeHtml(item.title)}</span><small>${escapeHtml(item.detail)}</small><b>Voir →</b></button>`).join('')}</section>
      <section class="two-columns home-columns">
        <article class="panel">
          <div class="panel-header"><div><h2>Interventions à venir</h2><p>Issues de l’Agenda Chantier existant.</p></div><button class="secondary" data-view="planning">Voir les affectations</button></div>
          ${upcoming.length ? `<div class="timeline">${upcoming.map((assignment) => {
            const members = resolveAssignmentMembers(state, assignment).map((id) => memberName(state, id));
            return `<button class="timeline-item timeline-button" data-view="planning"><span class="timeline-dot"></span><span><strong>${escapeHtml(assignment.title)}</strong><p>${escapeHtml(projectName(state, assignment.projectId))} · ${formatDateTime(assignment.start)}</p><small>${escapeHtml(members.join(', ') || 'Équipe à affecter')}</small></span></button>`;
          }).join('')}</div>` : this.empty('Aucune intervention à venir.')}
        </article>
        <article class="panel">
          <div class="panel-header"><div><h2>Actions du jour</h2><p>Les tâches qui nécessitent une décision.</p></div>${can(state, PERMISSIONS.MANAGE_REQUESTS) ? '<button class="secondary" data-action="open-task">Ajouter</button>' : ''}</div>
          ${openTasks.length ? `<div class="stack">${openTasks.slice(0, 6).map((task) => `<label class="task-row"><input type="checkbox" data-control="toggle-task" data-id="${task.id}"/><span><strong>${escapeHtml(task.title)}</strong><small>${escapeHtml(projectName(state, task.projectId))} · échéance ${formatDate(task.dueDate)}</small></span>${priorityBadge(task.priority)}</label>`).join('')}</div>` : this.empty('Aucune tâche ouverte.')}
        </article>
      </section>
      <section class="quick-mobile-actions">
        <button class="primary" data-view="terrain">Ouvrir le terrain</button>
        <button class="secondary" data-view="team">Voir l’équipe</button>
      </section>
    `;
  }

  kpi(label, value, detail) {
    return `<article class="kpi"><span>${escapeHtml(label)}</span><strong>${value}</strong><small>${escapeHtml(detail)}</small></article>`;
  }

  renderPlanning(state) {
    const assignments = state.assignments
      .filter((assignment) => visibleProjects(state).some((project) => project.id === assignment.projectId))
      .sort((a, b) => new Date(a.start) - new Date(b.start));
    const suggestions = state.suggestions.filter((suggestion) => suggestion.status === 'pending');
    const unassignedCount = assignments.filter((assignment) => resolveAssignmentMembers(state, assignment).length === 0).length;
    const capacity = buildCapacityOverview(state);
    const risks = assignmentAvailabilityRisks(state);
    return `
      <div class="calendar-source-banner">
        <div><span class="source-pulse"></span><strong>Source unique : Agenda Chantier SpeedArti</strong><p>Le module reçoit les interventions du calendrier chantier. Il modifie uniquement les affectations, jamais les dates.</p></div>
        ${badge(`${assignments.length} intervention(s) synchronisée(s)`, 'info')}
      </div>
      <div class="page-actions">
        <div><p class="lead">Affectez des équipes aux interventions déjà présentes dans l’Agenda Chantier.</p><small>${unassignedCount} intervention(s) restent sans équipe · ${risks.length} risque(s) d’indisponibilité.</small></div>
        ${can(state, PERMISSIONS.MANAGE_PLANNING) ? '<button class="primary" data-action="open-assignment">+ Affecter une équipe</button>' : ''}

      <article class="panel">
        <div class="panel-header"><div><h2>Interventions de l’Agenda Chantier</h2><p>Dates et chantiers en lecture seule. Les conflits et indisponibilités sont contrôlés.</p></div></div>
        ${assignments.length ? `<div class="planning-list">${assignments.map((assignment) => {
          const project = state.projects.find((item) => item.id === assignment.projectId);
          const members = resolveAssignmentMembers(state, assignment).map((id) => memberName(state, id));
          const conflicts = detectAssignmentConflicts(state, assignment, assignment.id);

            <div class="planning-main"><div class="row-between"><h3>${escapeHtml(assignment.title)}</h3>${members.length ? statusBadge(assignment.status) : badge('Équipe à affecter', 'warning')}</div><p>${escapeHtml(project?.name ?? '')} · ${escapeHtml(project?.address ?? '')}</p><small>${formatDateTime(assignment.start)} → ${formatDateTime(assignment.end)} · Agenda Chantier</small><div class="chips">${members.length ? members.map((name) => badge(name, 'person')).join('') : badge('Aucun collaborateur', 'neutral')} ${conflicts.length ? badge(`${conflicts.length} conflit(s)`, 'danger') : ''} ${assignmentRisks.map((risk) => badge(`${memberName(state, risk.memberId)} : ${risk.reason}`, 'danger')).join('')}</div></div>
            ${can(state, PERMISSIONS.MANAGE_PLANNING) ? `<div class="card-actions"><button class="icon-button" title="Modifier l’affectation" data-action="edit-assignment" data-id="${assignment.id}">✎</button>${members.length ? `<button class="icon-button danger" title="Retirer l’affectation" data-action="delete-assignment" data-id="${assignment.id}">×</button>` : ''}</div>` : ''}

      ${hasEdition(state, 'ultra') ? `<article class="panel ultra-panel">
        <div class="panel-header"><div><span class="eyebrow">Mode Ultra</span><h2>Affectations et réorganisations proposées</h2><p>Le moteur Ultra recherche les interventions sans équipe et les indisponibilités déclarées. Validation humaine obligatoire.</p></div><button class="secondary" data-action="generate-suggestions">Analyser le planning</button></div>
        ${suggestions.length ? `<div class="suggestion-grid">${suggestions.map((suggestion) => `<article class="suggestion"><div class="row-between"><strong>${escapeHtml(suggestion.assignmentTitle || projectName(state, suggestion.projectId))}</strong>${badge(suggestion.type === 'reorganization' ? 'Réorganisation' : `Score ${suggestion.score}`, suggestion.type === 'reorganization' ? 'warning' : 'purple')}</div><p>${suggestion.reasons.map(escapeHtml).join('<br>')}</p><div class="chips">${(suggestion.candidateMemberIds ?? suggestion.memberIds).map((id) => badge(memberName(state, id), 'person')).join('')}</div><div class="button-row"><button class="primary" data-action="approve-suggestion" data-id="${suggestion.id}">Valider la proposition</button><button class="ghost" data-action="reject-suggestion" data-id="${suggestion.id}">Refuser</button></div></article>`).join('')}</div>` : this.empty('Aucune suggestion en attente. Lancez l’analyse.')}
      </article>` : this.lockedPanel('Ultra', 'La planification intelligente est disponible dans le niveau Ultra.')}
    `;
  }


  renderTeam(state) {
    return `
      <div class="page-actions"><div><p class="lead">Profils, rôles, compétences, accès chantier et disponibilités opérationnelles.</p></div>${can(state, PERMISSIONS.MANAGE_TEAM) ? '<div class="button-row"><button class="secondary" data-action="open-crew">+ Créer une équipe</button><button class="primary" data-action="open-member">+ Ajouter un collaborateur</button></div>' : ''}</div>
      <article class="panel"><div class="panel-header"><div><h2>Collaborateurs</h2><p>Chaque membre peut recevoir un périmètre de chantiers et des droits individuels.</p></div></div>
        <div class="member-grid">${state.members.map((member) => {
          const days = (member.availability?.workingDays ?? []).map((day) => WORKDAY_LABELS[day]?.slice(0, 3)).join(' · ');
          const periods = member.availability?.unavailablePeriods ?? [];
          const scopeLabel = member.projectAccessMode === 'all' ? 'Tous les chantiers' : member.projectAccessMode === 'selected' ? `${member.projectAccessIds?.length ?? 0} chantier(s) sélectionné(s)` : member.projectAccessMode === 'assigned' ? 'Chantiers affectés uniquement' : 'Selon le rôle';
          return `<article class="member-card"><div class="avatar" style="--avatar-color:${escapeHtml(member.color || '#1167ff')}">${escapeHtml(member.name.slice(0, 2).toUpperCase())}</div><div class="member-info"><div class="row-between"><h3>${escapeHtml(member.name)}</h3>${statusBadge(member.status)}</div><p>${escapeHtml(ROLES[member.role])}</p><small>${escapeHtml(member.email || 'Aucun e-mail')} · ${escapeHtml(member.phone || 'Aucun téléphone')}</small><div class="chips">${(member.skills ?? []).map((skill) => badge(skill, 'person')).join('')}</div><div class="member-meta"><span>📁 ${escapeHtml(scopeLabel)}</span><span>🗓 ${escapeHtml(days || 'Aucun jour')} · ${member.availability?.weeklyHours ?? 35} h/sem.</span>${periods.length ? `<span class="danger-text">⛔ ${periods.length} indisponibilité(s)</span>` : ''}</div></div>${can(state, PERMISSIONS.MANAGE_TEAM) ? `<div class="member-actions"><button class="icon-button" title="Modifier" data-action="edit-member" data-id="${member.id}">✎</button><button class="icon-button" title="Disponibilités" data-action="open-availability" data-id="${member.id}">◷</button><button class="icon-button" title="Droits individuels" data-action="open-member-permissions" data-id="${member.id}">🔐</button></div>` : ''}</article>`;
        }).join('')}</div>
      </article>
      <article class="panel"><div class="panel-header"><div><h2>Équipes constituées</h2><p>Affectez une équipe entière à une intervention reçue de l’Agenda Chantier.</p></div></div>
        ${state.crews.length ? `<div class="crew-grid">${state.crews.map((crew) => `<article class="crew-card"><div class="row-between"><h3>${escapeHtml(crew.name)}</h3>${badge(`${crew.memberIds.length} membre(s)`, 'info')}</div><p>${escapeHtml((crew.specialties ?? []).join(' · ') || 'Aucune spécialité')}</p><div class="stack compact">${crew.memberIds.map((id) => `<span>• ${escapeHtml(memberName(state, id))}</span>`).join('')}</div>${can(state, PERMISSIONS.MANAGE_TEAM) ? `<div class="button-row"><button class="ghost" data-action="edit-crew" data-id="${crew.id}">Modifier</button><button class="ghost danger-text" data-action="delete-crew" data-id="${crew.id}">Supprimer</button></div>` : ''}</article>`).join('')}</div>` : this.empty('Aucune équipe créée.')}
      </article>
      <article class="panel scope-panel"><h2>Disponibilité ≠ pointage</h2><p>Les jours habituels et indisponibilités servent uniquement à préparer les affectations. Aucune heure d’arrivée, de départ ou géolocalisation n’est collectée.</p></article>
    `;
  }


  renderTerrain(state) {
    const projects = visibleProjects(state);
    const selectedProjectId = this.terrainProjectFilter !== 'all' && projects.some((project) => project.id === this.terrainProjectFilter) ? this.terrainProjectFilter : 'all';
    const projectIds = selectedProjectId === 'all' ? new Set(projects.map((project) => project.id)) : new Set([selectedProjectId]);
    const selectedProject = selectedProjectId === 'all' ? null : projects.find((project) => project.id === selectedProjectId);
    const feed = [
      ...state.messages.filter((item) => projectIds.has(item.projectId)).map((item) => ({ type: 'message', at: item.createdAt, item })),
      ...state.reports.filter((item) => projectIds.has(item.projectId)).map((item) => ({ type: 'report', at: item.date, item })),
      ...state.requests.filter((item) => projectIds.has(item.projectId)).map((item) => ({ type: 'request', at: item.createdAt, item })),
    ].sort((a, b) => new Date(b.at) - new Date(a.at));

    return `
      <div class="terrain-toolbar panel">
        <label>Chantier<select data-control="terrain-project-filter"><option value="all">Tous les chantiers</option>${projects.map((project) => `<option value="${project.id}" ${selectedProjectId === project.id ? 'selected' : ''}>${escapeHtml(project.name)}</option>`).join('')}</select></label>
        <div class="terrain-actions">
          ${can(state, PERMISSIONS.CREATE_REPORTS) ? '<button class="primary" data-action="open-report">+ Rapport</button>' : ''}
          ${can(state, PERMISSIONS.CREATE_REQUESTS) ? '<button class="secondary" data-action="open-request">+ Demande</button>' : ''}
          ${can(state, PERMISSIONS.SEND_MESSAGES) ? '<button class="secondary" data-action="open-message">+ Message</button>' : ''}
        </div>
      </div>
      ${selectedProject ? `<article class="project-focus panel"><div><span class="eyebrow">Fiche chantier</span><h2>${escapeHtml(selectedProject.name)}</h2><p>${escapeHtml(selectedProject.client || '')} · ${escapeHtml(selectedProject.address || '')}</p></div><div class="project-focus-meta">${statusBadge(selectedProject.status)}${priorityBadge(selectedProject.priority)}</div><small>${escapeHtml(selectedProject.notes || '')}</small></article>` : ''}
      <article class="panel terrain-feed-panel">
        <div class="panel-header"><div><h2>Fil terrain</h2><p>Messages, rapports et demandes regroupés chronologiquement.</p></div>${badge(`${feed.length} élément(s)`, 'info')}</div>
        ${feed.length ? `<div class="terrain-feed">${feed.map((entry) => this.renderTerrainEntry(state, entry)).join('')}</div>` : this.empty('Aucune activité terrain pour ce chantier.')}
      </article>
    `;
  }

  renderTerrainEntry(state, entry) {
    const item = entry.item;
    if (entry.type === 'message') {
      return `<article class="feed-entry"><span class="feed-icon">💬</span><div class="feed-body"><div class="feed-heading"><div><strong>Message · ${escapeHtml(memberName(state, item.authorId))}</strong><small>${escapeHtml(projectName(state, item.projectId))} · ${formatDateTime(item.createdAt)}</small></div>${badge('Message', 'neutral')}</div><p>${escapeHtml(item.body)}</p>${item.attachments?.length ? `<div class="chips">${item.attachments.map((attachment) => attachmentMarkup(state, attachment)).join('')}</div>` : ''}${hasEdition(state, 'expert') && can(state, PERMISSIONS.MANAGE_REPORTS) ? this.renderMessageAnalysis(state, item) : ''}</div></article>`;
    }
    if (entry.type === 'report') {
      return `<article class="feed-entry"><span class="feed-icon">📝</span><div class="feed-body"><div class="feed-heading"><div><strong>Rapport · ${escapeHtml(memberName(state, item.authorId))}</strong><small>${escapeHtml(projectName(state, item.projectId))} · ${formatDateTime(item.date)}</small></div>${badge(`${item.progress}%`, 'info')}</div><p>${escapeHtml(item.summary)}</p><div class="progress"><span style="width:${Math.max(0, Math.min(100, item.progress))}%"></span></div>${item.problems ? `<div class="inline-alert"><strong>⚠ Difficulté</strong><span>${escapeHtml(item.problems)}</span></div>` : ''}${item.materials ? `<div class="inline-info"><strong>Matériel</strong><span>${escapeHtml(item.materials)}</span></div>` : ''}${item.attachments?.length ? `<div class="chips">${item.attachments.map((attachment) => attachmentMarkup(state, attachment)).join('')}</div>` : ''}${hasEdition(state, 'expert') ? this.renderReportAnalysis(state, item) : ''}</div></article>`;
    }
    return `<article class="feed-entry"><span class="feed-icon">⚑</span><div class="feed-body"><div class="feed-heading"><div><strong>${escapeHtml(item.title)}</strong><small>${escapeHtml(projectName(state, item.projectId))} · par ${escapeHtml(memberName(state, item.authorId))} · ${formatDateTime(item.createdAt)}</small></div><div class="chips compact-chips">${priorityBadge(item.priority)}${statusBadge(item.status)}</div></div><p>${escapeHtml(item.description)}</p>${item.attachments?.length ? `<div class="chips">${item.attachments.map((attachment) => attachmentMarkup(state, attachment)).join('')}</div>` : ''}${item.type === 'material' && can(state, PERMISSIONS.MANAGE_REQUESTS) ? `<div class="material-actions"><button class="secondary small" data-action="material-stock-check" data-id="${item.id}">${item.stockCheck?.checkedAt ? 'Stock vérifié' : 'Vérifier le stock'}</button><button class="secondary small" data-action="prepare-order" data-id="${item.id}">${item.orderDraft?.createdAt ? 'Commande préparée' : 'Préparer une commande'}</button></div>` : ''}${can(state, PERMISSIONS.MANAGE_REQUESTS) ? `<label class="inline-status">Statut<select data-control="request-status" data-id="${item.id}"><option value="open" ${item.status === 'open' ? 'selected' : ''}>À traiter</option><option value="acknowledged" ${item.status === 'acknowledged' ? 'selected' : ''}>Prise en compte</option><option value="resolved" ${item.status === 'resolved' ? 'selected' : ''}>Résolue</option></select></label>` : ''}</div></article>`;
  }

  renderPilotage(state) {
    const missing = findMissingReports(state);
    const capacity = buildCapacityOverview(state);
    const risks = assignmentAvailabilityRisks(state);
    const unassigned = state.assignments.filter((assignment) => new Date(assignment.end) >= new Date() && resolveAssignmentMembers(state, assignment).length === 0);
    const suggestions = state.suggestions.filter((suggestion) => suggestion.status === 'pending');
    const unread = state.notifications.filter((notification) => !notification.read);
    const overloads = capacity.filter((item) => item.status === 'overload');
    return `
      <section class="pilotage-kpis">
        ${this.kpi('Sans équipe', unassigned.length, 'Interventions à affecter')}
        ${this.kpi('Rapports manquants', missing.length, 'À relancer')}
        ${this.kpi('Surcharges', overloads.length, 'Charge prévisionnelle')}
        ${this.kpi('Alertes', unread.length, 'Notifications non lues')}
      </section>
      <section class="two-columns pilotage-grid">
        <article class="panel"><div class="panel-header"><div><h2>Charge de l’équipe</h2><p>Prévision sur les interventions de l’Agenda Chantier.</p></div>${badge('Prévisionnel', 'purple')}</div><div class="capacity-grid compact-capacity">${capacity.map((item) => `<article class="capacity-card"><div class="row-between"><strong>${escapeHtml(memberName(state, item.memberId))}</strong>${badge(item.status === 'overload' ? 'Surcharge' : item.status === 'underload' ? 'Sous-charge' : 'Équilibré', item.status === 'overload' ? 'danger' : item.status === 'underload' ? 'warning' : 'success')}</div><div class="capacity-bar"><span style="width:${Math.min(100, item.loadPct)}%"></span></div><p><b>${item.loadPct}%</b> · ${item.plannedHours} h / ${item.capacityHours} h</p></article>`).join('')}</div></article>
        <article class="panel"><div class="panel-header"><div><h2>À contrôler</h2><p>Points nécessitant une décision humaine.</p></div></div><div class="pilotage-alert-list">${unassigned.map((assignment) => `<button data-view="planning"><strong>Équipe à affecter</strong><span>${escapeHtml(assignment.title)} · ${escapeHtml(projectName(state, assignment.projectId))}</span></button>`).join('')}${missing.map((item) => `<button data-action="remind-missing-report" data-assignment-id="${item.assignmentId}" data-member-id="${item.memberId}"><strong>Rapport manquant</strong><span>${escapeHtml(memberName(state, item.memberId))} · ${escapeHtml(projectName(state, item.projectId))}</span></button>`).join('')}${risks.map((risk) => `<button data-view="planning"><strong>Indisponibilité</strong><span>${escapeHtml(memberName(state, risk.memberId))} · ${escapeHtml(risk.reason)}</span></button>`).join('') || this.empty('Aucun point critique détecté.')}</div></article>
      </section>
      ${hasEdition(state, 'ultra') ? `<article class="panel ultra-panel"><div class="panel-header"><div><span class="eyebrow">Mode Ultra</span><h2>Propositions de réorganisation</h2><p>Le moteur du module prépare des propositions. Aucune modification n’est appliquée sans validation.</p></div><button class="secondary" data-action="generate-suggestions">Analyser les affectations</button></div>${suggestions.length ? `<div class="suggestion-grid">${suggestions.map((suggestion) => `<article class="suggestion"><div class="row-between"><strong>${escapeHtml(suggestion.assignmentTitle || projectName(state, suggestion.projectId))}</strong>${badge(suggestion.type === 'reorganization' ? 'Réorganisation' : `Score ${suggestion.score}`, suggestion.type === 'reorganization' ? 'warning' : 'purple')}</div><p>${suggestion.reasons.map(escapeHtml).join('<br>')}</p><div class="chips">${(suggestion.candidateMemberIds ?? suggestion.memberIds).map((id) => badge(memberName(state, id), 'person')).join('')}</div><div class="button-row"><button class="primary" data-action="approve-suggestion" data-id="${suggestion.id}">Valider</button><button class="ghost" data-action="reject-suggestion" data-id="${suggestion.id}">Refuser</button></div></article>`).join('')}</div>` : this.empty('Aucune proposition en attente.')}</article>` : ''}
      <article class="panel"><div class="panel-header"><div><h2>Notifications</h2><p>Dernières alertes du module.</p></div>${unread.length ? '<button class="secondary" data-action="mark-all-read">Tout marquer lu</button>' : ''}</div><div class="notification-list">${state.notifications.slice(0, 8).map((notification) => `<button class="notification ${notification.read ? '' : 'unread'}" data-action="mark-notification" data-id="${notification.id}"><span class="notification-icon">${notification.priority === 'urgent' ? '!' : notification.type === 'success' ? '✓' : 'i'}</span><span><strong>${escapeHtml(notification.title)}</strong><p>${escapeHtml(notification.body)}</p><small>${formatDateTime(notification.createdAt)}</small></span>${priorityBadge(notification.priority)}</button>`).join('') || this.empty('Aucune notification.')}</div></article>
    `;
  }


  renderReports(state) {
    const reports = state.reports
      .filter((report) => visibleProjects(state).some((project) => project.id === report.projectId))
      .sort((a, b) => new Date(b.date) - new Date(a.date));
    const missing = findMissingReports(state);
    return `
      <div class="page-actions"><div><p class="lead">Écriture ou dictée vocale, photos, difficultés, matériel et avancement.</p><small>${missing.length} rapport(s) attendu(s) pour des interventions terminées.</small></div><div class="button-row">${hasEdition(state, 'expert') && can(state, PERMISSIONS.MANAGE_REPORTS) ? '<button class="secondary" data-action="detect-missing-reports">Vérifier les rapports manquants</button>' : ''}${can(state, PERMISSIONS.CREATE_REPORTS) ? '<button class="primary" data-action="open-report">+ Nouveau rapport</button>' : ''}</div></div>
      ${missing.length ? `<article class="panel missing-panel"><div class="panel-header"><div><h2>Rapports manquants</h2><p>Interventions terminées sans rapport détecté pour le collaborateur affecté.</p></div>${badge(String(missing.length), 'warning')}</div><div class="stack compact">${missing.map((item) => `<div class="missing-row"><span><strong>${escapeHtml(memberName(state, item.memberId))}</strong><small>${escapeHtml(state.assignments.find((assignment) => assignment.id === item.assignmentId)?.title ?? 'Intervention')} · ${escapeHtml(projectName(state, item.projectId))} · attendu le ${formatDate(item.expectedAt)}</small></span>${can(state, PERMISSIONS.MANAGE_REPORTS) ? `<button class="secondary small" data-action="remind-missing-report" data-assignment-id="${item.assignmentId}" data-member-id="${item.memberId}">Relancer</button>` : ''}</div>`).join('')}</div></article>` : ''}
      ${reports.length ? `<div class="report-grid">${reports.map((report) => `<article class="panel report-card">
        <div class="row-between"><div><span class="eyebrow">${escapeHtml(projectName(state, report.projectId))}</span><h2>Rapport de ${escapeHtml(memberName(state, report.authorId))}</h2></div>${priorityBadge(report.analysis?.priority ?? 'normal')}</div>
        <p class="report-summary">${escapeHtml(report.summary)}</p>
        <div class="progress"><span style="width:${Math.max(0, Math.min(100, report.progress))}%"></span></div><small>${report.progress}% d’avancement · ${formatDateTime(report.date)}</small>
        ${report.problems ? `<div class="callout danger-callout"><strong>Difficulté signalée</strong><p>${escapeHtml(report.problems)}</p></div>` : ''}
        ${report.materials ? `<div class="callout"><strong>Matériel</strong><p>${escapeHtml(report.materials)}</p></div>` : ''}
        ${report.attachments?.length ? `<div class="chips">${report.attachments.map((attachment) => attachmentMarkup(state, attachment)).join('')}</div>` : ''}
        ${hasEdition(state, 'expert') ? this.renderReportAnalysis(state, report) : this.lockedInline('Analyse Expert non active')}
      </article>`).join('')}</div>` : this.empty('Aucun rapport terrain.')}
    `;
  }


  renderReportAnalysis(state, report) {
    if (!report.analysis) return can(state, PERMISSIONS.MANAGE_REPORTS) ? `<button class="secondary full" data-action="analyze-report" data-id="${report.id}">Analyser ce rapport</button>` : '';
    return `<section class="analysis-box"><div class="row-between"><strong>Analyse Expert</strong>${badge(report.analysis.classification, 'info')}</div><p>${escapeHtml(report.analysis.summary)}</p>${report.analysis.actions.length ? `<div class="stack compact">${report.analysis.actions.map((action) => `<div class="action-proposal"><div><strong>${escapeHtml(action.title)}</strong><small>${escapeHtml(action.description)}</small></div>${action.appliedAt ? badge('Appliquée', 'success') : `<button class="secondary small" data-action="apply-report-action" data-report-id="${report.id}" data-action-id="${action.id}">${escapeHtml(ACTION_LABELS[action.type] ?? 'Appliquer')}</button>`}</div>`).join('')}</div>` : ''}</section>`;
  }

  renderRequests(state) {
    const requests = state.requests.filter((request) => visibleProjects(state).some((project) => project.id === request.projectId));
    return `
      <div class="page-actions"><p class="lead">Matériel, documents, interventions, problèmes et absences imprévues.</p>${can(state, PERMISSIONS.CREATE_REQUESTS) ? '<button class="primary" data-action="open-request">+ Nouvelle demande</button>' : ''}</div>
      <article class="panel"><div class="request-columns">${['open', 'acknowledged', 'resolved'].map((status) => `<section><div class="column-title"><h3>${status === 'open' ? 'À traiter' : status === 'acknowledged' ? 'Prises en compte' : 'Résolues'}</h3>${badge(String(requests.filter((request) => request.status === status).length), 'neutral')}</div><div class="stack">${requests.filter((request) => request.status === status).map((request) => `<article class="request-card"><div class="row-between">${priorityBadge(request.priority)}${statusBadge(request.status)}</div><h4>${escapeHtml(request.title)}</h4><p>${escapeHtml(request.description)}</p>${request.attachments?.length ? `<div class="chips">${request.attachments.map((attachment) => attachmentMarkup(state, attachment)).join('')}</div>` : ''}<small>${escapeHtml(projectName(state, request.projectId))} · par ${escapeHtml(memberName(state, request.authorId))}<br>${formatDateTime(request.createdAt)}</small>${request.type === 'material' && can(state, PERMISSIONS.MANAGE_REQUESTS) ? `<div class="material-actions"><button class="secondary small" data-action="material-stock-check" data-id="${request.id}">${request.stockCheck?.checkedAt ? 'Stock vérifié' : 'Vérifier le stock'}</button><button class="secondary small" data-action="prepare-order" data-id="${request.id}">${request.orderDraft?.createdAt ? 'Commande préparée' : 'Préparer une commande'}</button></div>` : ''}${can(state, PERMISSIONS.MANAGE_REQUESTS) ? `<select data-control="request-status" data-id="${request.id}"><option value="open" ${request.status === 'open' ? 'selected' : ''}>À traiter</option><option value="acknowledged" ${request.status === 'acknowledged' ? 'selected' : ''}>Prise en compte</option><option value="resolved" ${request.status === 'resolved' ? 'selected' : ''}>Résolue</option></select>` : ''}</article>`).join('') || this.empty('Aucune demande.')}</div></section>`).join('')}</div></article>
    `;
  }


  renderMessages(state) {
    const projects = visibleProjects(state);
    const messages = state.messages
      .filter((message) => this.messageProjectFilter === 'all' || message.projectId === this.messageProjectFilter)
      .filter((message) => message.authorId === state.session.activeMemberId || message.recipientIds.includes(state.session.activeMemberId) || can(state, PERMISSIONS.VIEW_ALL_PROJECTS))
      .sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
    return `
      <div class="page-actions"><label class="filter-label">Chantier<select data-control="message-filter"><option value="all">Tous les chantiers</option>${projects.map((project) => `<option value="${project.id}" ${this.messageProjectFilter === project.id ? 'selected' : ''}>${escapeHtml(project.name)}</option>`).join('')}</select></label><p class="lead">La messagerie équipe reste séparée de la messagerie client.</p></div>
      <article class="panel messaging-panel"><div class="message-list">${messages.length ? messages.map((message) => `<div class="message ${message.authorId === state.session.activeMemberId ? 'mine' : ''}"><div class="message-meta"><strong>${escapeHtml(memberName(state, message.authorId))}</strong><span>${escapeHtml(projectName(state, message.projectId))} · ${formatDateTime(message.createdAt)}</span></div><p>${escapeHtml(message.body)}</p>${message.attachments?.length ? `<small>${message.attachments.map((attachment) => attachmentMarkup(state, attachment)).join(' ')}</small>` : ''}${hasEdition(state, 'expert') && can(state, PERMISSIONS.MANAGE_REPORTS) ? this.renderMessageAnalysis(state, message) : ''}</div>`).join('') : this.empty('Aucun message.')}</div>
        ${can(state, PERMISSIONS.SEND_MESSAGES) ? `<form data-form="message" class="composer"><label>Chantier<select name="projectId" required>${projects.map((project) => `<option value="${project.id}">${escapeHtml(project.name)}</option>`).join('')}</select></label><label>Destinataires<select name="recipientIds" multiple required>${state.members.filter((member) => member.id !== state.session.activeMemberId && member.status === 'active').map((member) => `<option value="${member.id}">${escapeHtml(member.name)}</option>`).join('')}</select></label><label class="grow">Message<textarea name="body" required placeholder="Écrivez un message interne..."></textarea></label><label>Pièces jointes<input type="file" name="attachments" multiple /></label><button class="primary" type="submit">Envoyer</button></form>` : ''}
      </article>
    `;
  }

  renderMessageAnalysis(state, message) {
    if (!message.analysis) return `<button class="analysis-trigger" data-action="analyze-message" data-id="${message.id}">✦ Analyser le message</button>`;
    return `<section class="message-analysis"><div class="row-between"><strong>Analyse Expert</strong>${badge(message.analysis.classification, 'info')}</div><small>${escapeHtml(message.analysis.summary)}</small>${message.analysis.actions.length ? `<div class="stack compact">${message.analysis.actions.map((action) => `<div class="action-proposal"><div><strong>${escapeHtml(action.title)}</strong><small>${escapeHtml(action.description)}</small></div>${action.appliedAt ? badge('Appliquée', 'success') : `<button class="secondary small" data-action="apply-message-action" data-message-id="${message.id}" data-action-id="${action.id}">${escapeHtml(ACTION_LABELS[action.type] ?? 'Appliquer')}</button>`}</div>`).join('')}</div>` : ''}</section>`;
  }


  renderAngel(state) {
    if (!hasEdition(state, 'expert')) return this.lockedPanel('Expert', 'Ángel Collaborateurs nécessite le niveau Expert ou Ultra.');
    const conversations = state.angelConversations ?? [];
    const quickQuestions = ['Quels rapports manquent ?', 'Qui est disponible ?', 'Où sont les problèmes de matériel ?', 'Y a-t-il une surcharge ?'];
    return `
      <div class="page-actions"><div><p class="lead">Posez des questions sur les équipes, les rapports, les alertes et la charge prévisionnelle.</p><small>Les réponses sont calculées localement à partir des données du module.</small></div></div>
      <section class="angel-layout">
        <article class="panel angel-chat"><div class="angel-messages">${conversations.length ? conversations.map((item) => `<div class="angel-turn"><div class="angel-question"><strong>Vous</strong><p>${escapeHtml(item.question)}</p></div><div class="angel-answer"><strong>Ángel</strong><h3>${escapeHtml(item.response.title)}</h3><p>${escapeHtml(item.response.answer)}</p>${item.response.items?.length ? `<ul>${item.response.items.map((line) => `<li>${escapeHtml(line)}</li>`).join('')}</ul>` : ''}<small>${formatDateTime(item.createdAt)}</small></div></div>`).join('') : this.empty('Aucune question posée.')}</div><form data-form="angel-question" class="angel-composer"><textarea name="question" required placeholder="Ex. Quels collaborateurs sont disponibles cette semaine ?"></textarea><button class="primary" type="submit">Demander à Ángel</button></form></article>
        <aside class="panel"><h2>Questions rapides</h2><div class="button-stack">${quickQuestions.map((question) => `<button class="secondary" data-action="ask-quick-question" data-question="${escapeHtml(question)}">${escapeHtml(question)}</button>`).join('')}</div><div class="callout"><strong>Validation humaine</strong><p>Ángel répond et propose. Il ne modifie jamais une affectation, une demande ou un planning sans validation.</p></div></aside>
      </section>
    `;
  }

  renderHistory(state) {
    const entityTypes = [...new Set(state.audit.map((item) => item.entityType))].sort();
    const items = state.audit.filter((item) => this.auditFilter === 'all' || item.entityType === this.auditFilter);
    return `
      <div class="page-actions"><div><p class="lead">Traçabilité complète des actions réalisées dans le module.</p><small>Les dates du chantier restent gérées exclusivement dans l’Agenda Chantier.</small></div><label class="filter-label">Type<select data-control="audit-filter"><option value="all">Toutes les actions</option>${entityTypes.map((type) => `<option value="${escapeHtml(type)}" ${this.auditFilter === type ? 'selected' : ''}>${escapeHtml(type)}</option>`).join('')}</select></label></div>
      <article class="panel"><div class="audit-list expanded">${items.length ? items.map((item) => `<div><strong>${escapeHtml(item.action)}</strong><span>${escapeHtml(memberName(state, item.actorId))} · ${formatDateTime(item.createdAt)}</span><small>${escapeHtml(item.entityType)} / ${escapeHtml(item.entityId)}${item.details ? ` · ${escapeHtml(item.details)}` : ''}</small></div>`).join('') : this.empty('Aucune action pour ce filtre.')}</div></article>
    `;
  }

  renderNotifications(state) {
