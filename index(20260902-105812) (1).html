<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#1167ff" />
  <meta name="description" content="Démo fonctionnelle autonome SpeedArti Équipe & Planning v1.4" />
  <title>SpeedArti — Équipe & Planning v1.4</title>
  <style>:root {
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #13213a;
  background: #f4f7fc;
  font-synthesis: none;
  --blue: #1167ff;
  --blue-dark: #0b4bc2;
  --navy: #10213f;
  --border: #dfe7f3;
  --muted: #6b7890;
  --surface: #ffffff;
  --shadow: 0 18px 48px rgba(31, 55, 95, .09);
}

* { box-sizing: border-box; }
body { margin: 0; min-width: 320px; min-height: 100vh; background: radial-gradient(circle at top right, #e9f2ff 0, transparent 34rem), #f4f7fc; }
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .55; }
h1, h2, h3, h4, p { margin-top: 0; }
h1 { font-size: clamp(1.35rem, 2vw, 1.8rem); margin-bottom: .25rem; }
h2 { font-size: 1.05rem; margin-bottom: .35rem; }
h3 { font-size: .98rem; margin-bottom: .25rem; }
p { line-height: 1.5; }
small { color: var(--muted); line-height: 1.4; }
select, input, textarea {
  width: 100%; border: 1px solid var(--border); border-radius: 10px; padding: .72rem .8rem; background: #fff; color: var(--navy);
}
textarea { min-height: 90px; resize: vertical; }
select:focus, input:focus, textarea:focus { outline: 3px solid rgba(17, 103, 255, .12); border-color: var(--blue); }
label { display: grid; gap: .4rem; color: #40506b; font-size: .86rem; }
fieldset { border: 1px solid var(--border); border-radius: 12px; padding: 1rem; margin: 1rem 0; }
legend { padding: 0 .4rem; font-weight: 700; color: var(--navy); }

.app-shell { min-height: 100vh; display: grid; grid-template-columns: 250px minmax(0, 1fr); }
.sidebar { background: linear-gradient(180deg, #10264a, #0c1d37); color: white; padding: 1.25rem 1rem; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
.brand { display: flex; align-items: center; gap: .75rem; padding: .3rem .5rem 1.5rem; }
.brand-mark { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: linear-gradient(135deg, #5ab6ff, #1167ff); color: white; font-size: 1.35rem; font-weight: 900; box-shadow: 0 12px 28px rgba(17, 103, 255, .35); }
.brand strong { display: block; font-size: 1.05rem; }
.brand small { color: #a9bddb; }
.sidebar nav { display: grid; gap: .35rem; }
.nav-item { border: 0; background: transparent; color: #c6d5e9; display: grid; grid-template-columns: 24px 1fr auto; align-items: center; gap: .65rem; padding: .78rem .8rem; text-align: left; border-radius: 11px; }
.nav-item:hover, .nav-item.active { color: white; background: rgba(255,255,255,.1); }
.nav-item.active { box-shadow: inset 3px 0 0 #57a8ff; }
.nav-item em { background: #ff5d6c; min-width: 22px; height: 22px; border-radius: 999px; display: grid; place-items: center; font-size: .72rem; font-style: normal; }
.scope-note { margin-top: auto; display: grid; gap: .25rem; padding: .85rem; border: 1px solid rgba(255,255,255,.1); border-radius: 12px; background: rgba(255,255,255,.05); }
.scope-note span { color: #a9bddb; font-size: .78rem; }
.workspace { min-width: 0; }
.topbar { min-height: 80px; padding: 1rem 1.5rem; background: rgba(255,255,255,.88); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 1rem; position: sticky; top: 0; z-index: 10; }
.topbar p { margin-bottom: 0; color: var(--muted); font-size: .84rem; }
.topbar-actions { display: flex; align-items: center; gap: .75rem; }
.user-switcher { display: flex; align-items: center; gap: .55rem; }
.user-switcher span { white-space: nowrap; }
.user-switcher select { min-width: 230px; padding: .55rem .7rem; }
.content { padding: 1.5rem; max-width: 1500px; margin: 0 auto; }

.panel, .kpi { background: var(--surface); border: 1px solid rgba(211, 222, 238, .9); border-radius: 17px; box-shadow: var(--shadow); }
.panel { padding: 1.15rem; margin-bottom: 1.2rem; }
.panel-header, .row-between, .page-actions { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; }
.panel-header { margin-bottom: 1rem; }
.panel-header p, .lead { color: var(--muted); margin-bottom: 0; }
.page-actions { margin-bottom: 1rem; align-items: center; }
.kpi-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1rem; margin-bottom: 1.2rem; }
.kpi { padding: 1.05rem; display: grid; gap: .25rem; }
.kpi > span { color: var(--muted); font-size: .84rem; }
.kpi strong { font-size: 1.85rem; color: var(--navy); }
.kpi small { font-size: .77rem; }
.two-columns { display: grid; grid-template-columns: 1.15fr .85fr; gap: 1.2rem; align-items: start; }
.stack { display: grid; gap: .75rem; }
.stack.compact { gap: .35rem; }
.button-row { display: flex; flex-wrap: wrap; gap: .55rem; align-items: center; }
.button-stack { display: grid; gap: .65rem; }
.primary, .secondary, .ghost, .icon-button, .segmented button, .edition-card {
  border: 0; border-radius: 10px; padding: .65rem .88rem; font-weight: 700; transition: .16s ease;
}
.primary { background: var(--blue); color: white; box-shadow: 0 8px 18px rgba(17, 103, 255, .22); }
.primary:hover { background: var(--blue-dark); transform: translateY(-1px); }
.secondary { background: #eaf2ff; color: #0b55d0; }
.secondary:hover { background: #dceaff; }
.ghost { background: transparent; color: #4b5d79; border: 1px solid var(--border); }
.ghost:hover { background: #f7f9fc; }
.primary.full, .secondary.full { width: 100%; margin-top: .8rem; }
.secondary.small { padding: .42rem .58rem; font-size: .75rem; }
.icon-button { width: 36px; height: 36px; padding: 0; background: #f1f5fa; color: #445671; display: grid; place-items: center; }
.icon-button.danger, .danger-text { color: #c33547; }
.card-actions { display: flex; gap: .4rem; }
.segmented { background: #e8eef7; padding: .25rem; border-radius: 12px; display: flex; gap: .2rem; }
.segmented button { background: transparent; color: var(--muted); }
.segmented button.active { background: white; color: var(--navy); box-shadow: 0 4px 10px rgba(31,55,95,.08); }

.badge { display: inline-flex; align-items: center; justify-content: center; padding: .28rem .5rem; border-radius: 999px; font-size: .7rem; font-weight: 800; white-space: nowrap; }
.badge-neutral { background: #edf1f6; color: #5a677b; }
.badge-info { background: #e4efff; color: #0b5bd9; }
.badge-success { background: #e1f7ed; color: #0d7a4f; }
.badge-warning { background: #fff2d7; color: #9a5b00; }
.badge-danger { background: #ffe3e7; color: #bd3043; }
.badge-purple { background: #eee8ff; color: #6541cc; }
.badge-person { background: #f0f5ff; color: #355c9a; }
.chips { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .65rem; }
.eyebrow { color: var(--blue); text-transform: uppercase; letter-spacing: .1em; font-size: .67rem; font-weight: 900; }

.timeline { display: grid; gap: .7rem; }
.timeline-item { display: grid; grid-template-columns: 14px 1fr; gap: .75rem; position: relative; }
.timeline-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--blue); margin-top: .35rem; box-shadow: 0 0 0 5px #e9f1ff; }
.timeline-item p { margin: .2rem 0; color: #4f607b; font-size: .82rem; }
.task-row { grid-template-columns: auto 1fr auto; align-items: center; display: grid; gap: .7rem; padding: .75rem; border: 1px solid var(--border); border-radius: 12px; }
.task-row input { width: 18px; height: 18px; }
.task-row span { display: grid; gap: .15rem; }
.expert-strip { background: linear-gradient(110deg, #10264a, #173f78); color: white; display: flex; justify-content: space-between; align-items: center; }
.expert-strip p { color: #c8d7ec; max-width: 760px; margin-bottom: 0; }
.expert-strip .eyebrow { color: #75b8ff; }

.planning-list { display: grid; gap: .75rem; }
.planning-card { display: grid; grid-template-columns: 68px minmax(0, 1fr) auto; gap: 1rem; padding: .9rem; border: 1px solid var(--border); border-radius: 14px; align-items: start; }
.planning-card.has-conflict { border-color: #f3a5b0; background: #fffafb; }
.date-block { width: 58px; min-height: 62px; border-radius: 13px; background: #edf4ff; color: var(--blue); display: grid; place-items: center; align-content: center; }
.date-block strong { font-size: 1.35rem; line-height: 1; }
.date-block span { text-transform: uppercase; font-size: .68rem; font-weight: 800; }
.planning-main p { margin: .2rem 0; color: #53627a; }
.ultra-panel { border-color: #d9cffc; background: linear-gradient(145deg, #fff, #f8f5ff); }
.suggestion-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: .75rem; }
.suggestion { border: 1px solid #ded5fb; border-radius: 13px; padding: .9rem; background: white; }
.suggestion p { font-size: .8rem; color: #59677d; }
.locked { display: flex; align-items: center; gap: 1rem; border-style: dashed; box-shadow: none; }
.locked > span { font-size: 1.6rem; }
.locked p { margin-bottom: 0; color: var(--muted); }
.locked-inline { margin-top: .8rem; background: #f6f7f9; border-radius: 10px; padding: .65rem; color: var(--muted); font-size: .8rem; }

.member-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: .75rem; }
.member-card { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: .8rem; border: 1px solid var(--border); border-radius: 14px; padding: .85rem; }
.avatar { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; background: color-mix(in srgb, var(--avatar-color) 16%, white); color: var(--avatar-color); font-weight: 900; }
.member-info p { color: var(--muted); font-size: .82rem; margin: .1rem 0; }
.crew-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: .75rem; }
.crew-card { padding: .9rem; border-radius: 14px; border: 1px solid var(--border); }
.crew-card p { color: var(--muted); font-size: .82rem; }

.report-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 1rem; align-items: start; }
.report-card { margin: 0; }
.report-summary { margin: .8rem 0; }
.progress { height: 8px; background: #e9eef5; border-radius: 999px; overflow: hidden; margin-bottom: .4rem; }
.progress span { display: block; height: 100%; background: linear-gradient(90deg, #1167ff, #57a8ff); border-radius: inherit; }
.callout { padding: .7rem; background: #f5f8fc; border-radius: 10px; margin-top: .7rem; }
.callout p { margin: .2rem 0 0; color: #56657c; font-size: .82rem; }
.danger-callout { background: #fff1f3; }
.analysis-box { margin-top: .9rem; padding: .8rem; border-radius: 12px; background: #eef5ff; border: 1px solid #d4e5ff; }
.analysis-box > p { color: #4e617f; font-size: .82rem; }
.action-proposal { display: grid; grid-template-columns: 1fr auto; gap: .7rem; align-items: center; background: white; border-radius: 10px; padding: .65rem; }
.action-proposal div { display: grid; gap: .15rem; }

.request-columns { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem; }
.column-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: .7rem; }
.request-card { border: 1px solid var(--border); border-radius: 13px; padding: .75rem; background: #fbfcfe; }
.request-card h4 { margin: .65rem 0 .25rem; }
.request-card p { color: #59677d; font-size: .82rem; }
.request-card select { margin-top: .65rem; padding: .5rem; }

.messaging-panel { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 1rem; min-height: 560px; }
.message-list { background: #f6f8fb; border-radius: 14px; padding: 1rem; display: flex; flex-direction: column; gap: .75rem; max-height: 620px; overflow: auto; }
.message { align-self: flex-start; max-width: 78%; padding: .75rem .85rem; border-radius: 14px 14px 14px 4px; background: white; border: 1px solid var(--border); }
.message.mine { align-self: flex-end; border-radius: 14px 14px 4px 14px; background: #e8f1ff; border-color: #d2e3ff; }
.message-meta { display: flex; flex-wrap: wrap; justify-content: space-between; gap: .5rem; font-size: .73rem; }
.message-meta span { color: var(--muted); }
.message p { margin: .45rem 0 0; white-space: pre-wrap; }
.composer { border-left: 1px solid var(--border); padding-left: 1rem; display: flex; flex-direction: column; gap: .75rem; }
.composer .grow { flex: 1; }
.composer .grow textarea { min-height: 170px; }
.filter-label { display: flex; align-items: center; gap: .55rem; }
.filter-label select { min-width: 240px; }

.notification-list { display: grid; gap: .55rem; }
.notification { width: 100%; border: 1px solid var(--border); background: white; padding: .8rem; border-radius: 12px; display: grid; grid-template-columns: auto 1fr auto; gap: .8rem; text-align: left; align-items: start; }
.notification.unread { background: #f3f8ff; border-color: #cfe1ff; }
.notification-icon { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; background: #e5efff; color: var(--blue); font-weight: 900; }
.notification p { margin: .2rem 0; color: #59677d; }

.settings-grid { grid-template-columns: 1fr 1fr; }
.edition-cards { display: grid; gap: .55rem; }
.edition-card { width: 100%; text-align: left; background: #f7f9fc; border: 1px solid var(--border); display: grid; gap: .25rem; }
.edition-card span { font-size: .78rem; color: var(--muted); font-weight: 500; }
.edition-card.selected { border-color: var(--blue); background: #edf4ff; box-shadow: inset 3px 0 0 var(--blue); }
.file-button { display: block; text-align: center; }
.permissions-table-wrap { overflow: auto; }
.permissions-table { border-collapse: collapse; width: 100%; min-width: 980px; }
.permissions-table th, .permissions-table td { border-bottom: 1px solid var(--border); padding: .55rem; text-align: center; font-size: .76rem; }
.permissions-table th:first-child, .permissions-table td:first-child { text-align: left; position: sticky; left: 0; background: white; }
.permissions-table input { width: 17px; height: 17px; }
.audit-list { display: grid; gap: .5rem; }
.audit-list > div { display: grid; grid-template-columns: minmax(170px, .8fr) minmax(200px, 1fr) 2fr; gap: .7rem; padding: .6rem 0; border-bottom: 1px solid var(--border); font-size: .78rem; }
.scope-panel { border-color: #f0c2c8; background: #fff9fa; }

.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; }
.full-span { grid-column: 1 / -1; }
.checkbox-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .55rem; }
.checkbox-grid label { display: flex; align-items: center; gap: .5rem; }
.checkbox-grid input { width: 17px; height: 17px; }
.form-hint { color: var(--muted); font-size: .78rem; background: #f6f8fb; border-radius: 10px; padding: .65rem; }
.modal-backdrop { position: fixed; inset: 0; z-index: 100; background: rgba(8, 20, 38, .62); display: grid; place-items: center; padding: 1rem; }
.modal { width: min(760px, 100%); max-height: 92vh; overflow: auto; background: white; border-radius: 18px; padding: 1.35rem; box-shadow: 0 30px 80px rgba(0,0,0,.25); position: relative; }
.modal-close { position: absolute; top: .8rem; right: .8rem; border: 0; width: 34px; height: 34px; border-radius: 50%; background: #eef2f7; color: #526077; font-size: 1.2rem; }
.modal-actions { display: flex; justify-content: flex-end; gap: .6rem; margin-top: 1rem; }
.toast { position: fixed; right: 1rem; bottom: 1rem; z-index: 200; padding: .8rem 1rem; border-radius: 12px; color: white; background: #14784f; box-shadow: 0 15px 40px rgba(0,0,0,.2); }
.toast-error { background: #bc3346; }
.toast-info { background: #345d98; }
.empty { min-height: 100px; display: grid; place-items: center; align-content: center; color: var(--muted); text-align: center; }
.empty span { font-size: 1.7rem; }
.empty p { margin-bottom: 0; }
.fatal { padding: 3rem; }

@media (max-width: 1100px) {
  .kpi-grid { grid-template-columns: repeat(2, 1fr); }
  .two-columns, .settings-grid { grid-template-columns: 1fr; }
  .request-columns { grid-template-columns: 1fr; }
  .messaging-panel { grid-template-columns: 1fr; }
  .composer { border-left: 0; border-top: 1px solid var(--border); padding: 1rem 0 0; }
}

@media (max-width: 780px) {
  .app-shell { grid-template-columns: 1fr; }
  .sidebar { position: static; height: auto; padding: .75rem; }
  .sidebar nav { display: flex; overflow-x: auto; }
  .nav-item { min-width: max-content; grid-template-columns: 20px auto auto; }
  .scope-note { display: none; }
  .brand { padding-bottom: .75rem; }
  .topbar { position: static; align-items: flex-start; flex-direction: column; }
  .topbar-actions { width: 100%; justify-content: space-between; }
  .user-switcher { flex: 1; }
  .user-switcher select { min-width: 0; }
  .content { padding: 1rem; }
  .page-actions, .panel-header { flex-direction: column; align-items: stretch; }
  .kpi-grid { grid-template-columns: 1fr 1fr; }
  .planning-card { grid-template-columns: 58px minmax(0, 1fr); }
  .planning-card .card-actions { grid-column: 1 / -1; justify-content: flex-end; }
  .member-grid, .report-grid { grid-template-columns: 1fr; }
  .form-grid { grid-template-columns: 1fr; }
  .full-span { grid-column: auto; }
  .checkbox-grid { grid-template-columns: 1fr; }
  .audit-list > div { grid-template-columns: 1fr; gap: .15rem; }
}

@media (max-width: 480px) {
  .kpi-grid { grid-template-columns: 1fr; }
  .topbar-actions { align-items: stretch; flex-direction: column; }
  .user-switcher { flex-direction: column; align-items: stretch; }
  .member-card { grid-template-columns: auto 1fr; }
  .member-card > .icon-button { grid-column: 1 / -1; justify-self: end; }
  .message { max-width: 95%; }
}
.dictation-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .6rem; align-items: start; }
.dictation-row button { white-space: nowrap; }
@media (max-width: 600px) { .dictation-row { grid-template-columns: 1fr; } }
.attachment-button { border: 0; border-radius: 999px; padding: .3rem .55rem; background: #edf1f6; color: #4d5e77; font-size: .7rem; font-weight: 800; }
.attachment-button:hover { background: #dfe8f5; }


.calendar-source-banner { display:flex; align-items:center; justify-content:space-between; gap:20px; padding:18px 20px; margin-bottom:18px; border:1px solid #b9d4ff; border-radius:16px; background:linear-gradient(135deg,#eff6ff,#ffffff); }
.calendar-source-banner div:first-child { display:grid; grid-template-columns:auto 1fr; column-gap:10px; align-items:center; }
.calendar-source-banner p { grid-column:2; margin:4px 0 0; color:var(--muted); }
.source-pulse { width:10px; height:10px; border-radius:999px; background:#16a36a; box-shadow:0 0 0 6px rgba(22,163,106,.12); }
.readonly-source { margin-top:14px; padding-top:12px; border-top:1px solid var(--border); color:var(--muted); font-size:.82rem; }
.calendar-event-summary { margin:16px 0; padding:16px; border:1px solid #b9d4ff; border-radius:14px; background:#f7fbff; }
.calendar-event-summary span { display:block; color:#1167ff; font-size:.76rem; font-weight:800; text-transform:uppercase; letter-spacing:.08em; }
.calendar-event-summary strong { display:block; margin-top:5px; font-size:1.05rem; }
.calendar-event-summary p { margin:5px 0; }
.calendar-event-summary small { color:var(--muted); }
.planning-card.unassigned { border-style:dashed; background:#fffdfa; }
@media (max-width:760px){ .calendar-source-banner{align-items:flex-start;flex-direction:column;} }

/* Version 1.2 — disponibilités, Expert, Ultra et traçabilité */
.member-meta { display:grid; gap:.25rem; margin-top:.65rem; color:var(--muted); font-size:.74rem; }
.member-actions { display:flex; flex-direction:column; gap:.35rem; }
.capacity-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:.75rem; }
.capacity-card { border:1px solid var(--border); border-radius:14px; padding:.85rem; background:#fbfcff; }
.capacity-card p { color:var(--muted); font-size:.8rem; margin:.55rem 0 .25rem; }
.capacity-bar { height:9px; border-radius:999px; background:#e9eef5; overflow:hidden; margin-top:.65rem; }
.capacity-bar span { display:block; height:100%; border-radius:inherit; background:linear-gradient(90deg,#1167ff,#8b5cf6); }
.missing-panel { border-color:#f4d08a; background:#fffdf7; }
.missing-row { display:flex; justify-content:space-between; align-items:center; gap:1rem; border-bottom:1px solid var(--border); padding:.65rem 0; }
.missing-row span { display:grid; gap:.18rem; }
.material-actions { display:flex; flex-wrap:wrap; gap:.4rem; margin-top:.65rem; }
.message-analysis { margin-top:.65rem; padding:.65rem; border-radius:10px; border:1px solid #d8e5fb; background:#f6f9ff; color:#31445f; }
.analysis-trigger { margin-top:.55rem; border:0; background:transparent; color:var(--blue); font-size:.72rem; font-weight:800; padding:0; }
.permission-overrides { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:.55rem; max-height:55vh; overflow:auto; }
.permission-overrides label { display:grid; grid-template-columns:minmax(0,1fr) 150px; align-items:center; gap:.55rem; padding:.45rem; border:1px solid var(--border); border-radius:10px; }
.permission-overrides span { font-size:.72rem; word-break:break-word; }
.availability-add { margin-top:.8rem; }
.angel-layout { display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:1rem; }
.angel-chat { display:grid; grid-template-rows:minmax(380px,1fr) auto; min-height:620px; }

  worker: [P.VIEW_DASHBOARD, P.VIEW_PLANNING, P.VIEW_REPORTS, P.CREATE_REPORTS, P.VIEW_REQUESTS, P.CREATE_REQUESTS, P.VIEW_MESSAGES, P.SEND_MESSAGES, P.DOWNLOAD_ATTACHMENTS],
  site_manager: [P.VIEW_DASHBOARD, P.VIEW_TEAM, P.MANAGE_AVAILABILITY, P.VIEW_PLANNING, P.MANAGE_PLANNING, P.VIEW_CAPACITY, P.VIEW_REPORTS, P.CREATE_REPORTS, P.MANAGE_REPORTS, P.VIEW_REQUESTS, P.CREATE_REQUESTS, P.MANAGE_REQUESTS, P.VIEW_MESSAGES, P.SEND_MESSAGES, P.DOWNLOAD_ATTACHMENTS, P.VIEW_ALL_PROJECTS, P.VIEW_AUDIT, P.USE_EXPERT, P.USE_ULTRA, P.ASK_ANGEL],
  sales: [P.VIEW_DASHBOARD, P.VIEW_PLANNING, P.VIEW_MESSAGES, P.SEND_MESSAGES, P.DOWNLOAD_ATTACHMENTS, P.VIEW_ALL_PROJECTS],

function uid(prefix = 'id') {
  return `${prefix}_${crypto.randomUUID?.() ?? `${Date.now()}_${Math.random().toString(16).slice(2)}`}`;
}

function nowIso() {
  return new Date().toISOString();
}

function hasEdition(state, minimum) {
  const rank = { standard: 1, expert: 2, ultra: 3 };
  return rank[state.settings.edition] >= rank[minimum];
}

function getActiveMember(state) {
  return state.members.find((member) => member.id === state.session.activeMemberId) ?? state.members[0] ?? null;
}

function memberPermissions(state, member) {
  if (!member) return [];
  const rolePermissions = state.settings.rolePermissions[member.role] ?? [];
  const permissions = new Set(rolePermissions);
  for (const [permission, value] of Object.entries(member.permissionOverrides ?? {})) {
    if (value === true) permissions.add(permission);
    if (value === false) permissions.delete(permission);
  }
  return [...permissions];
}

function can(state, permission) {
  return memberPermissions(state, getActiveMember(state)).includes(permission);
}

function isProjectVisibleToMember(state, project, memberId = state.session.activeMemberId) {
  const member = state.members.find((item) => item.id === memberId);
  if (!member) return false;
  const scope = member.projectAccessMode ?? 'role';
  if (scope === 'all') return true;
  if (scope === 'selected') return (member.projectAccessIds ?? []).includes(project.id);
  const assigned = state.assignments.some((assignment) => assignment.projectId === project.id && resolveAssignmentMembers(state, assignment).includes(member.id));
  if (scope === 'assigned') return assigned;
  return memberPermissions(state, member).includes(P.VIEW_ALL_PROJECTS) || assigned;
}

function resolveAssignmentMembers(state, assignment) {
  const crewMembers = state.crews
    .filter((crew) => assignment.crewIds?.includes(crew.id))
    .flatMap((crew) => crew.memberIds);
  return [...new Set([...(assignment.memberIds ?? []), ...crewMembers])];
}

function overlaps(startA, endA, startB, endB) {
  return new Date(startA).getTime() < new Date(endB).getTime()
    && new Date(endA).getTime() > new Date(startB).getTime();
}

function detectAssignmentConflicts(state, candidate, ignoreAssignmentId = null) {
  const candidateMembers = resolveAssignmentMembers(state, candidate);
  return state.assignments
    .filter((assignment) => assignment.id !== ignoreAssignmentId)
    .filter((assignment) => overlaps(candidate.start, candidate.end, assignment.start, assignment.end))
    .flatMap((assignment) => {
      const shared = resolveAssignmentMembers(state, assignment).filter((memberId) => candidateMembers.includes(memberId));
      return shared.map((memberId) => ({ assignment, memberId }));
    });
}

function memberAvailabilityIssues(member, start, end) {
  if (!member || member.status !== 'active') return ['Collaborateur inactif'];
  const issues = [];
  const periods = member.availability?.unavailablePeriods ?? [];
  for (const period of periods) {
    if (overlaps(start, end, period.start, period.end)) issues.push(period.reason || 'Indisponibilité déclarée');
  }
  const workingDays = member.availability?.workingDays ?? [1, 2, 3, 4, 5];
  let hasWorkingDay = false;
  const cursor = new Date(start);
  const limit = new Date(end);
  cursor.setHours(12, 0, 0, 0);
  while (cursor <= limit) {
    if (workingDays.includes(cursor.getDay())) { hasWorkingDay = true; break; }
    cursor.setDate(cursor.getDate() + 1);
  }
  if (!hasWorkingDay) issues.push('Aucun jour habituel de travail sur cette période');
  return issues;
}

function formatDateTime(value) {
  if (!value) return '—';
  return new Intl.DateTimeFormat('fr-FR', {
    dateStyle: 'short',
    timeStyle: 'short',
  }).format(new Date(value));
}

function formatDate(value) {
  if (!value) return '—';
  return new Intl.DateTimeFormat('fr-FR', { dateStyle: 'medium' }).format(new Date(value));
}

function escapeHtml(value = '') {
  return String(value)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}

const today = new Date();
const day = (offset, hour = 8) => {
  const date = new Date(today);
  date.setDate(date.getDate() + offset);
  date.setHours(hour, 0, 0, 0);
  return date.toISOString();
};

function availability(weeklyHours = 35, extra = {}) {
  return { weeklyHours, workingDays: [1, 2, 3, 4, 5], unavailablePeriods: [], ...extra };
}

// ---- src/analyzer.js ----
const URGENT_WORDS = ['urgent', 'danger', 'accident', 'bloqué', 'bloquee', 'impossible', 'fuite', 'sécurité', 'securite'];
const HIGH_WORDS = ['retard', 'panne', 'absence', 'absent', 'malade', 'manque', 'cassé', 'casse', 'problème', 'probleme'];
const MATERIAL_WORDS = ['tuile', 'tuiles', 'vis', 'bois', 'liteau', 'liteaux', 'mortier', 'isolant', 'zinc', 'gouttière', 'gouttiere', 'ardoise', 'ardoises'];
const ABSENCE_WORDS = ['absence', 'absent', 'malade', 'indisponible', 'ne pourrai pas venir', 'pas venir'];
const DELAY_WORDS = ['retard', 'décalage', 'decalage', 'repousser', 'bloqué', 'bloquee'];

function includesAny(text, words) {
  return words.some((word) => text.includes(word));
}

function priorityFromText(text) {
  return includesAny(text, URGENT_WORDS) ? 'urgent' : includesAny(text, HIGH_WORDS) ? 'high' : 'normal';
}

function analyzeReport(report) {
  const text = `${report.summary ?? ''} ${report.problems ?? ''} ${report.materials ?? ''}`.toLocaleLowerCase('fr-FR');
  const detectedMaterials = MATERIAL_WORDS.filter((word) => text.includes(word));
  const priority = priorityFromText(text);
  const issueDetected = Boolean(report.problems?.trim()) || includesAny(text, [...URGENT_WORDS, ...HIGH_WORDS]);
  const materialDetected = Boolean(report.materials?.trim()) || detectedMaterials.length > 0;
  const actions = [];

  if (materialDetected) {
    actions.push({
      id: uid('suggestion'),
      type: 'create_material_request',
      title: 'Créer une demande de matériel',
      description: report.materials?.trim() || `Matériel détecté : ${detectedMaterials.join(', ')}`,
      priority,
    });
  }
  if (issueDetected) {
    actions.push({
      id: uid('suggestion'),
      type: 'notify_manager',
      title: 'Notifier le dirigeant',
      description: report.problems?.trim() || 'Un problème a été détecté dans le rapport.',
      priority,
    });
  }
  if ((report.progress ?? 0) < 50) {
    actions.push({
      id: uid('suggestion'),
      type: 'review_progress',
      title: "Vérifier l'avancement",
      description: `Avancement déclaré : ${report.progress ?? 0} %.`,
      priority: priority === 'normal' ? 'high' : priority,
    });
  }

  return {
    generatedAt: new Date().toISOString(),
    classification: materialDetected ? 'matériel' : issueDetected ? 'problème' : 'avancement',
    priority,
    issueDetected,
    materialDetected,
    detectedMaterials,
    actions,
    summary: actions.length > 0
      ? `${actions.length} action(s) proposée(s). Validation humaine obligatoire.`
      : 'Aucune action particulière détectée.',
  };
}

function analyzeMessage(message) {
  const text = String(message.body ?? '').toLocaleLowerCase('fr-FR');
  const priority = priorityFromText(text);
  const materialDetected = includesAny(text, MATERIAL_WORDS) && includesAny(text, ['manque', 'besoin', 'commander', 'prévoir', 'prevoir']);
  const absenceDetected = includesAny(text, ABSENCE_WORDS);
  const delayDetected = includesAny(text, DELAY_WORDS);
  const issueDetected = materialDetected || absenceDetected || delayDetected || includesAny(text, [...URGENT_WORDS, ...HIGH_WORDS]);
  const actions = [];

  if (materialDetected) {
    actions.push({ id: uid('message_action'), type: 'create_material_request', title: 'Créer une demande de matériel', description: message.body, priority });
  }
  if (absenceDetected) {
    actions.push({ id: uid('message_action'), type: 'create_absence_request', title: 'Créer une alerte d’absence', description: message.body, priority: priority === 'normal' ? 'high' : priority });
    actions.push({ id: uid('message_action'), type: 'prepare_reorganization', title: 'Préparer une réorganisation', description: 'Rechercher les interventions concernées et proposer un remplacement.', priority: 'high' });
  }
  if (delayDetected) {
    actions.push({ id: uid('message_action'), type: 'create_delay_task', title: 'Créer une tâche de suivi du retard', description: message.body, priority: priority === 'normal' ? 'high' : priority });
  }
  if (issueDetected && !actions.some((action) => action.type === 'notify_manager')) {
    actions.push({ id: uid('message_action'), type: 'notify_manager', title: 'Notifier le dirigeant', description: message.body, priority });
  }

  return {
    generatedAt: new Date().toISOString(),
    classification: absenceDetected ? 'absence' : materialDetected ? 'matériel' : delayDetected ? 'retard' : issueDetected ? 'problème' : 'information',
    priority,
    issueDetected,
    materialDetected,
    absenceDetected,
    delayDetected,
    actions,
    summary: actions.length ? `${actions.length} action(s) proposée(s). Validation humaine obligatoire.` : 'Message informatif, aucune action détectée.',
  };
}


// ---- src/capacity.js ----
function eachDay(start, end) {
  const days = [];
  const cursor = new Date(start);
  const limit = new Date(end);
  cursor.setHours(12, 0, 0, 0);
  limit.setHours(12, 0, 0, 0);
  while (cursor <= limit) {
    days.push(new Date(cursor));
    cursor.setDate(cursor.getDate() + 1);
  }
  return days;
}

function plannedHoursForAssignment(member, assignment) {
  const workingDays = member.availability?.workingDays ?? [1, 2, 3, 4, 5];
  const dailyHours = Math.max(1, (member.availability?.weeklyHours ?? 35) / Math.max(1, workingDays.length));
  const days = eachDay(assignment.start, assignment.end).filter((date) => workingDays.includes(date.getDay()));
  return Math.round(days.length * dailyHours * 10) / 10;
}

function capacityHoursForPeriod(member, start, end) {
  const workingDays = member.availability?.workingDays ?? [1, 2, 3, 4, 5];
  const dailyHours = Math.max(1, (member.availability?.weeklyHours ?? 35) / Math.max(1, workingDays.length));
  const unavailable = member.availability?.unavailablePeriods ?? [];
  const days = eachDay(start, end).filter((date) => {
    if (!workingDays.includes(date.getDay())) return false;
    const dayStart = new Date(date); dayStart.setHours(0, 0, 0, 0);
    const dayEnd = new Date(date); dayEnd.setHours(23, 59, 59, 999);
    return !unavailable.some((period) => overlaps(dayStart, dayEnd, period.start, period.end));
  });
  return Math.round(days.length * dailyHours * 10) / 10;
}

function buildCapacityOverview(state, start = new Date(), horizonDays = 28) {
  const from = new Date(start);
  from.setHours(0, 0, 0, 0);
  const to = new Date(from);
  to.setDate(to.getDate() + horizonDays);
  to.setHours(23, 59, 59, 999);
  return state.members
    .filter((member) => member.status === 'active')
    .map((member) => {
      const assignments = state.assignments.filter((assignment) => resolveAssignmentMembers(state, assignment).includes(member.id) && overlaps(assignment.start, assignment.end, from, to));
      const plannedHours = Math.round(assignments.reduce((sum, assignment) => sum + plannedHoursForAssignment(member, assignment), 0) * 10) / 10;
      const capacityHours = capacityHoursForPeriod(member, from, to);
      const loadPct = capacityHours > 0 ? Math.round((plannedHours / capacityHours) * 100) : (plannedHours ? 999 : 0);
      const status = loadPct > 110 ? 'overload' : loadPct < 45 ? 'underload' : 'balanced';
      return { memberId: member.id, plannedHours, capacityHours, loadPct, status, assignmentCount: assignments.length };
    })
    .sort((a, b) => b.loadPct - a.loadPct);
}

function assignmentAvailabilityRisks(state, referenceDate = new Date()) {
  const now = new Date(referenceDate);
  return state.assignments.filter((assignment) => new Date(assignment.end) >= now && !['completed', 'archived'].includes(assignment.status)).flatMap((assignment) => resolveAssignmentMembers(state, assignment).flatMap((memberId) => {
    const member = state.members.find((item) => item.id === memberId);
    return memberAvailabilityIssues(member, assignment.start, assignment.end).map((reason) => ({ assignmentId: assignment.id, memberId, reason }));
  }));
}


// ---- src/insights.js ----
function sameLocalDay(a, b) {
  const da = new Date(a);
  const db = new Date(b);
  return da.getFullYear() === db.getFullYear() && da.getMonth() === db.getMonth() && da.getDate() === db.getDate();
}

function findMissingReports(state, referenceDate = new Date()) {
  const now = new Date(referenceDate);
  return state.assignments
    .filter((assignment) => new Date(assignment.end) < now)
    .flatMap((assignment) => resolveAssignmentMembers(state, assignment).map((memberId) => ({ assignment, memberId })))
    .filter(({ assignment, memberId }) => !state.reports.some((report) => report.authorId === memberId && (report.assignmentId === assignment.id || (report.projectId === assignment.projectId && sameLocalDay(report.date, assignment.end)))))
    .map(({ assignment, memberId }) => ({ assignmentId: assignment.id, projectId: assignment.projectId, memberId, expectedAt: assignment.end }));
}

function answerTeamQuestion(state, question) {
  const text = String(question || '').toLocaleLowerCase('fr-FR');
  const missing = findMissingReports(state);
  const capacity = buildCapacityOverview(state);
  const materialRequests = state.requests.filter((request) => request.type === 'material' && request.status !== 'resolved');
  const problemRequests = state.requests.filter((request) => ['site_problem', 'unexpected_absence'].includes(request.type) && request.status !== 'resolved');

  if (text.includes('rapport') && (text.includes('manqu') || text.includes('pas envoyé') || text.includes('pas envoye'))) {
    if (!missing.length) return { title: 'Rapports manquants', answer: 'Aucun rapport manquant n’est détecté pour les interventions terminées.', items: [] };
    return { title: 'Rapports manquants', answer: `${missing.length} rapport(s) sont attendus.`, items: missing.map((item) => `${state.members.find((member) => member.id === item.memberId)?.name ?? 'Collaborateur'} — ${state.assignments.find((assignment) => assignment.id === item.assignmentId)?.title ?? 'Intervention'} (${formatDate(item.expectedAt)})`) };
  }
  if (text.includes('matériel') || text.includes('materiel')) {
    return { title: 'Problèmes de matériel', answer: materialRequests.length ? `${materialRequests.length} demande(s) de matériel restent ouvertes.` : 'Aucune demande de matériel ouverte.', items: materialRequests.map((request) => `${request.title} — ${state.projects.find((project) => project.id === request.projectId)?.name ?? 'Chantier'}`) };
  }
  if (text.includes('disponib') || text.includes('libre')) {
    const available = capacity.filter((item) => item.loadPct < 80).slice(0, 5);
    return { title: 'Disponibilités prévisionnelles', answer: available.length ? `${available.length} collaborateur(s) ont une charge inférieure à 80 % sur les 4 prochaines semaines.` : 'Aucun collaborateur clairement disponible sur la période.', items: available.map((item) => `${state.members.find((member) => member.id === item.memberId)?.name ?? 'Collaborateur'} — charge ${item.loadPct} %`) };
  }
  if (text.includes('surcharge') || text.includes('charge') || text.includes('renfort')) {
    const overloaded = capacity.filter((item) => item.status === 'overload');
    return { title: 'Charge des équipes', answer: overloaded.length ? `${overloaded.length} collaborateur(s) dépassent 110 % de charge prévisionnelle.` : 'Aucune surcharge supérieure à 110 % n’est détectée.', items: overloaded.map((item) => `${state.members.find((member) => member.id === item.memberId)?.name ?? 'Collaborateur'} — ${item.loadPct} %`) };
  }
  if (text.includes('problème') || text.includes('probleme') || text.includes('absence')) {
    return { title: 'Alertes terrain', answer: problemRequests.length ? `${problemRequests.length} alerte(s) terrain restent ouvertes.` : 'Aucune alerte terrain ouverte.', items: problemRequests.map((request) => `${request.title} — ${state.projects.find((project) => project.id === request.projectId)?.name ?? 'Chantier'}`) };
  }
  return {
    title: 'Synthèse Équipe & Planning',
    answer: `${state.members.filter((member) => member.status === 'active').length} collaborateur(s) actifs, ${state.assignments.length} intervention(s), ${materialRequests.length + problemRequests.length} demande(s) sensible(s) et ${missing.length} rapport(s) manquant(s).`,
    items: ['Essaie : « Quels rapports manquent ? »', '« Qui est disponible ? »', '« Où sont les problèmes de matériel ? »', '« Y a-t-il une surcharge ? »'],
  };
}


// ---- src/optimizer.js ----
function scoreMember(state, project, assignment, member, capacityMap) {
  if (member.status !== 'active') return { score: -999, reasons: ['Collaborateur inactif'] };
  const candidate = { ...assignment, memberIds: [member.id], crewIds: [] };
  const conflicts = detectAssignmentConflicts(state, candidate, assignment.id);
  const availabilityIssues = memberAvailabilityIssues(member, assignment.start, assignment.end);
  const matchingSkills = (project.requiredSkills ?? []).filter((skill) => member.skills?.includes(skill));
  let score = matchingSkills.length * 30;
  const reasons = [];
  if (matchingSkills.length) reasons.push(`Compétences adaptées : ${matchingSkills.join(', ')}`);
  if (!project.requiredSkills?.length) { score += 10; reasons.push('Aucune compétence obligatoire'); }
  if (conflicts.length) { score -= 100; reasons.push(`${conflicts.length} conflit(s) d’affectation`); }
  else { score += 25; reasons.push('Disponible sur cette intervention'); }
  if (availabilityIssues.length) { score -= 120; reasons.push(`Indisponibilité : ${availabilityIssues.join(', ')}`); }
  const capacity = capacityMap.get(member.id);
  if (capacity) {
    if (capacity.loadPct > 110) { score -= 45; reasons.push(`Surcharge prévisionnelle : ${capacity.loadPct} %`); }
    else if (capacity.loadPct < 70) { score += 15; reasons.push(`Capacité disponible : charge ${capacity.loadPct} %`); }
  }
  if (member.role === 'team_lead' || member.role === 'site_manager') { score += 10; reasons.push('Capacité de coordination'); }
  return { score, reasons };
}

function rankMembers(state, project, assignment, excludedIds = []) {
  const capacityMap = new Map(buildCapacityOverview(state).map((item) => [item.memberId, item]));
  return state.members
    .filter((member) => !excludedIds.includes(member.id))
    .map((member) => ({ member, ...scoreMember(state, project, assignment, member, capacityMap) }))
    .filter((entry) => entry.score > -50)
    .sort((a, b) => b.score - a.score)
    .slice(0, 3);
}

function buildPlanningSuggestions(state) {
  const unassigned = state.assignments
    .filter((assignment) => resolveAssignmentMembers(state, assignment).length === 0)
    .flatMap((assignment) => {
      const project = state.projects.find((item) => item.id === assignment.projectId);
      if (!project || ['completed', 'invoiced', 'archived'].includes(project.status)) return [];
      const ranked = rankMembers(state, project, assignment);
      if (!ranked.length) return [];
      return [{
        id: uid('assignment_suggestion'),
        type: 'assignment',
        assignmentId: assignment.id,
        assignmentTitle: assignment.title,
        projectId: project.id,
        start: assignment.start,
        end: assignment.end,
        memberIds: [ranked[0].member.id],
        candidateMemberIds: ranked.map((entry) => entry.member.id),
        score: ranked[0].score,
        reasons: ranked.flatMap((entry) => [`${entry.member.name} : ${entry.reasons.join(' · ')}`]),
        status: 'pending',
        createdAt: new Date().toISOString(),
      }];
    });

  const reorganization = state.assignments.flatMap((assignment) => {
    const project = state.projects.find((item) => item.id === assignment.projectId);
    if (!project || ['completed', 'invoiced', 'archived'].includes(project.status)) return [];
    const assignedIds = resolveAssignmentMembers(state, assignment);
    const risks = assignedIds.flatMap((memberId) => {
      const member = state.members.find((item) => item.id === memberId);
      return memberAvailabilityIssues(member, assignment.start, assignment.end).map((reason) => ({ memberId, reason }));
    });
    if (!risks.length) return [];
    const ranked = rankMembers(state, project, assignment, assignedIds);
    if (!ranked.length) return [];
    return [{
      id: uid('reorganization_suggestion'),
      type: 'reorganization',
      assignmentId: assignment.id,
      assignmentTitle: assignment.title,
      projectId: project.id,
      start: assignment.start,
      end: assignment.end,
      replaceMemberIds: [...new Set(risks.map((risk) => risk.memberId))],
      memberIds: [ranked[0].member.id],
      candidateMemberIds: ranked.map((entry) => entry.member.id),
      score: ranked[0].score,
      reasons: [
        ...risks.map((risk) => `${state.members.find((member) => member.id === risk.memberId)?.name ?? 'Collaborateur'} : ${risk.reason}`),
        ...ranked.map((entry) => `Remplacement proposé — ${entry.member.name} : ${entry.reasons.join(' · ')}`),
      ],
      status: 'pending',
      createdAt: new Date().toISOString(),
    }];
  });

  return [...unassigned, ...reorganization];
}


// ---- src/attachments.js ----
const DB_NAME = 'speedarti-team-planning-files';
const STORE_NAME = 'files';
const DB_VERSION = 1;
const MAX_FILE_SIZE = 10 * 1024 * 1024;

function openDatabase() {
  return new Promise((resolve, reject) => {
    if (!('indexedDB' in window)) {
      reject(new Error('Le stockage de fichiers IndexedDB n’est pas disponible dans ce navigateur.'));
      return;
    }
    const request = indexedDB.open(DB_NAME, DB_VERSION);
    request.onupgradeneeded = () => {
      const database = request.result;
      if (!database.objectStoreNames.contains(STORE_NAME)) {
        database.createObjectStore(STORE_NAME, { keyPath: 'id' });
      }
    };
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error ?? new Error('Ouverture du stockage documentaire impossible.'));
  });
}

async function transact(mode, operation) {
  const database = await openDatabase();
  try {
    return await new Promise((resolve, reject) => {
      const transaction = database.transaction(STORE_NAME, mode);
      const store = transaction.objectStore(STORE_NAME);
      const request = operation(store);
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error ?? new Error('Opération documentaire impossible.'));
      transaction.onabort = () => reject(transaction.error ?? new Error('Transaction documentaire annulée.'));
    });
  } finally {
    database.close();
  }
}

async function saveAttachments(files) {
  const selected = [...files].filter((file) => file instanceof File && file.name);
  const saved = [];
  for (const file of selected) {
    if (file.size > MAX_FILE_SIZE) {
      throw new Error(`Le fichier « ${file.name} » dépasse la limite autonome de 10 Mo.`);
    }
    const record = {
      id: uid('attachment'),
      name: file.name,
      type: file.type || 'application/octet-stream',
      size: file.size,
      blob: file,
      createdAt: new Date().toISOString(),
    };
    await transact('readwrite', (store) => store.put(record));
    saved.push({ id: record.id, name: record.name, type: record.type, size: record.size });
  }
  return saved;
}

async function getAttachment(id) {
  return transact('readonly', (store) => store.get(id));
}

async function downloadAttachment(id) {
  const record = await getAttachment(id);
  if (!record) throw new Error('Fichier introuvable dans le stockage local.');
  const url = URL.createObjectURL(record.blob);
  const anchor = document.createElement('a');
  anchor.href = url;
  anchor.download = record.name;
  anchor.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function deleteAttachment(id) {
  await transact('readwrite', (store) => store.delete(id));
}

function blobToDataUrl(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result));
    reader.onerror = () => reject(reader.error ?? new Error('Lecture du fichier impossible.'));
    reader.readAsDataURL(blob);
  });
}

async function exportAttachments() {
  const records = await transact('readonly', (store) => store.getAll());
  return Promise.all(records.map(async (record) => ({
    id: record.id,
    name: record.name,
    type: record.type,
    size: record.size,
    createdAt: record.createdAt,
    dataUrl: await blobToDataUrl(record.blob),
  })));
}

async function importAttachments(records = []) {
  const prepared = [];
  for (const record of records) {
    if (!record?.id || !record?.dataUrl) continue;
    const blob = await fetch(record.dataUrl).then((response) => response.blob());
    prepared.push({
      id: record.id,
      name: record.name,
      type: record.type,
      size: record.size,
      createdAt: record.createdAt,
      blob,
    });
  }

  const database = await openDatabase();
  try {
    await new Promise((resolve, reject) => {
      const transaction = database.transaction(STORE_NAME, 'readwrite');
      const store = transaction.objectStore(STORE_NAME);
      store.clear();
      for (const record of prepared) store.put(record);
      transaction.oncomplete = () => resolve();
      transaction.onerror = () => reject(transaction.error ?? new Error('Import des fichiers impossible.'));
      transaction.onabort = () => reject(transaction.error ?? new Error('Import des fichiers annulé.'));
    });
  } finally {
    database.close();
  }
}

const STORAGE_KEY = 'speedarti.team-planning.agenda-demo.v2';

function deepClone(value) {
  return structuredClone(value);
}

function mergeRolePermissions(existing = {}) {
  const result = {};
  for (const [role, defaults] of Object.entries(DEFAULT_ROLE_PERMISSIONS)) {
    result[role] = [...new Set([...(existing[role] ?? []), ...defaults.filter((permission) => permission === 'download_attachments')])];
  }
  return result;
}

function migrateState(input) {
  const state = deepClone(input);
  state.schemaVersion = 2;
  state.settings ??= {};
  state.settings.rolePermissions = mergeRolePermissions(state.settings.rolePermissions);
  state.members ??= [];
  state.members = state.members.map((member) => ({
    permissionOverrides: {},
    projectAccessMode: member.role === 'owner' ? 'all' : 'role',
    projectAccessIds: [],
    availability: { weeklyHours: 35, workingDays: [1, 2, 3, 4, 5], unavailablePeriods: [] },
    ...member,
    permissionOverrides: member.permissionOverrides ?? {},
    projectAccessIds: member.projectAccessIds ?? [],
    availability: {
      weeklyHours: member.availability?.weeklyHours ?? 35,
      workingDays: member.availability?.workingDays ?? [1, 2, 3, 4, 5],
      unavailablePeriods: member.availability?.unavailablePeriods ?? [],
    },
  }));
  state.messages = (state.messages ?? []).map((message) => ({ analysis: null, attachments: [], readBy: [], ...message }));
  state.reports = state.reports ?? [];
  state.requests = (state.requests ?? []).map((request) => ({ attachments: [], ...request }));
  state.tasks ??= [];
  state.notifications ??= [];
  state.suggestions ??= [];
  state.angelConversations ??= [];
  state.audit ??= [];
  state.projects ??= [];
  state.assignments ??= [];
  state.crews ??= [];
  state.integration ??= { identitySyncedAt: null, entitlementsSyncedAt: null, agendaSyncedAt: null, rhSyncedAt: null };
  return state;
}

class TeamPlanningStore extends EventTarget {
  constructor(repository = localStorage) {
    super();
    this.repository = repository;
    this.state = this.load();
  }

  load() {
    try {
      const raw = this.repository.getItem(STORAGE_KEY);
      if (!raw) return createSeedState();
      return migrateState(JSON.parse(raw));
    } catch (error) {
      console.warn('Impossible de charger les données locales.', error);
      return createSeedState();
    }
  }

  getState() {
    return deepClone(this.state);
  }

  setState(nextState, options = {}) {
    this.state = migrateState(nextState);
    this.persist();
    this.dispatchEvent(new CustomEvent('change', { detail: this.getState() }));
    if (!options.silent) {
      window.dispatchEvent(new CustomEvent('speedarti:team-planning:changed', { detail: this.getState() }));
    }
  }

  update(mutator, audit = null) {
    const next = this.getState();
    mutator(next);
    if (audit) {
      next.audit.unshift({
        id: uid('audit'),
        actorId: next.session.activeMemberId,
        action: audit.action,
        entityType: audit.entityType,
        entityId: audit.entityId,
        details: audit.details ?? '',
        createdAt: nowIso(),
      });
    }
    this.setState(next);
  }

  persist() {
    this.repository.setItem(STORAGE_KEY, JSON.stringify(this.state));
  }

  reset() {
    this.setState(createSeedState());
  }

  exportJson() {
    return JSON.stringify(this.state, null, 2);
  }

  importJson(raw) {
    const parsed = JSON.parse(raw);
    if (![1, 2].includes(parsed.schemaVersion) || !Array.isArray(parsed.members) || !Array.isArray(parsed.projects)) {
      throw new Error('Fichier incompatible avec le schéma Équipe & Planning.');
    }
    this.setState(migrateState(parsed));
  }
}

function createIntegrationEnvelope({
  eventType,
  source = 'equipe_planning',
  target,
  companyId,
  payload,
  correlationId = null,
  idempotencyKey = null,
  metadata = {},
}) {
  if (!eventType || !target || !companyId) throw new Error('eventType, target et companyId sont obligatoires.');
  const eventId = uid('evt');
  return {
    schemaVersion: INTEGRATION_SCHEMA_VERSION,
    eventId,
    eventType,
    source,
    target,
    companyId,
    occurredAt: nowIso(),
    correlationId,
    idempotencyKey: idempotencyKey || `${companyId}:${eventType}:${eventId}`,
    payload: structuredClone(payload ?? {}),
    metadata: { moduleVersion: '1.3.0', ...metadata },
  };
}

function validateIntegrationEnvelope(envelope) {
  const errors = [];
  if (!envelope || typeof envelope !== 'object') return { valid: false, errors: ['Enveloppe absente.'] };
  for (const field of ['schemaVersion', 'eventId', 'eventType', 'source', 'target', 'companyId', 'occurredAt', 'idempotencyKey']) {
    if (!envelope[field] || typeof envelope[field] !== 'string') errors.push(`Champ ${field} manquant ou invalide.`);
  }
  if (!Object.values(SPEEDARTI_MODULES).includes(envelope.target) && envelope.target !== 'equipe_planning') {
    errors.push(`Module cible inconnu : ${envelope.target}.`);
  }
  if (envelope.payload === null || typeof envelope.payload !== 'object') errors.push('payload doit être un objet.');
  return { valid: errors.length === 0, errors };
}

function assertIntegrationEnvelope(envelope) {
  const result = validateIntegrationEnvelope(envelope);
  if (!result.valid) throw new Error(result.errors.join(' '));
  return envelope;
}

const OUTBOX_KEY = 'speedarti.team-planning.integration.outbox.v1';

class MemoryRepository {
  constructor() { this.values = new Map(); }
  getItem(key) { return this.values.get(key) ?? null; }
  setItem(key, value) { this.values.set(key, value); }
}

class IntegrationOutbox {
  constructor(repository = globalThis.localStorage ?? new MemoryRepository()) {
    this.repository = repository;
    this.items = this.load();
  }

  load() {
    try {
      const raw = this.repository.getItem(OUTBOX_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch {
      return [];
    }
  }

  persist() {
    this.repository.setItem(OUTBOX_KEY, JSON.stringify(this.items));
  }

  enqueue(envelope) {
    assertIntegrationEnvelope(envelope);
    const existing = this.items.find((item) => item.envelope.idempotencyKey === envelope.idempotencyKey && item.status !== 'dead');
    if (existing) return structuredClone(existing);
    const item = {
      id: uid('outbox'),
      envelope: structuredClone(envelope),
      status: 'pending',
      attempts: 0,
      createdAt: nowIso(),
      updatedAt: nowIso(),
      nextAttemptAt: nowIso(),
      lastError: null,
      response: null,
    };
    this.items.unshift(item);
    this.persist();
    return structuredClone(item);
  }

  list({ status = null, target = null } = {}) {
    return structuredClone(this.items.filter((item) => (!status || item.status === status) && (!target || item.envelope.target === target)));
  }

  getPending(target = null) {
    const now = Date.now();
    return this.list({ target }).filter((item) => ['pending', 'failed'].includes(item.status) && new Date(item.nextAttemptAt).getTime() <= now);
  }

  markSending(id) {
    this.patch(id, { status: 'sending', attemptsDelta: 1, lastError: null });
  }

  markSent(id, response = null) {
    this.patch(id, { status: 'sent', response, lastError: null });
  }

  markFailed(id, error, { retry = true } = {}) {
    const item = this.items.find((candidate) => candidate.id === id);
    if (!item) return;
    const attempts = item.attempts;
    const dead = !retry || attempts >= 5;
    const delayMs = Math.min(60_000 * (2 ** Math.max(0, attempts - 1)), 60 * 60_000);
    this.patch(id, {
      status: dead ? 'dead' : 'failed',
      lastError: error instanceof Error ? error.message : String(error),
      nextAttemptAt: new Date(Date.now() + delayMs).toISOString(),
    });
  }

  retry(id) {
    this.patch(id, { status: 'pending', nextAttemptAt: nowIso(), lastError: null });
  }

  clearSent() {
    this.items = this.items.filter((item) => item.status !== 'sent');
    this.persist();
  }

  patch(id, values) {
    const item = this.items.find((candidate) => candidate.id === id);
    if (!item) throw new Error('Événement Outbox introuvable.');
    if (values.attemptsDelta) item.attempts += values.attemptsDelta;
    Object.assign(item, values);
    delete item.attemptsDelta;
    item.updatedAt = nowIso();
    this.persist();
  }
}


// ---- src/integrations/connectors/base-connector.js ----
class PreparedConnector {
  constructor(moduleName, options = {}) {
    this.moduleName = moduleName;
    this.mode = options.mode ?? 'disabled';
    this.enabled = options.enabled ?? false;
    this.config = structuredClone(options.config ?? {});
    this.sent = [];
    this.received = [];
    this.lastError = null;
    this.lastSuccessAt = null;
  }

  configure(options = {}) {
    if (typeof options.enabled === 'boolean') this.enabled = options.enabled;
    if (options.mode) this.mode = options.mode;
    if (options.config) this.config = { ...this.config, ...structuredClone(options.config) };
    return this.getStatus();
  }

  getStatus() {
    return {
      module: this.moduleName,
      enabled: this.enabled,
      mode: this.mode,
      ready: this.enabled && this.mode !== 'disabled',
      lastError: this.lastError,
      lastSuccessAt: this.lastSuccessAt,
      sentCount: this.sent.length,
      receivedCount: this.received.length,
      configured: Object.keys(this.config).length > 0,
    };
  }

  async send(envelope) {
    if (!this.enabled || this.mode === 'disabled') throw new Error(`Connecteur ${this.moduleName} désactivé.`);
    if (this.mode === 'mock') {
      this.sent.push(structuredClone(envelope));
      this.lastSuccessAt = new Date().toISOString();
      return { accepted: true, mode: 'mock', eventId: envelope.eventId };
    }
    throw new Error(`Transport ${this.mode} non configuré pour ${this.moduleName}.`);
  }

  async pull() {
    if (!this.enabled || this.mode === 'disabled') throw new Error(`Connecteur ${this.moduleName} désactivé.`);
    if (this.mode === 'mock') return [];
    throw new Error(`Lecture ${this.mode} non configurée pour ${this.moduleName}.`);
  }
}

class HttpJsonConnector extends PreparedConnector {
  constructor(moduleName, options = {}) {
    super(moduleName, { ...options, mode: options.mode ?? 'http' });
    this.fetchImpl = options.fetchImpl ?? globalThis.fetch;
    this.tokenProvider = options.tokenProvider ?? null;
  }

  async headers() {
    const token = this.tokenProvider ? await this.tokenProvider() : null;
    return {
      'content-type': 'application/json',
      ...(token ? { authorization: `Bearer ${token}` } : {}),
      ...(this.config.headers ?? {}),
    };
  }

  resolveUrl(kind) {
    const baseUrl = String(this.config.baseUrl ?? '').replace(/\/$/, '');
    const path = this.config.endpoints?.[kind];
    if (!baseUrl || !path) throw new Error(`URL ${kind} non configurée pour ${this.moduleName}.`);
    return `${baseUrl}/${String(path).replace(/^\//, '')}`;
  }

  async send(envelope) {
    if (!this.enabled) throw new Error(`Connecteur ${this.moduleName} désactivé.`);
    if (this.mode === 'mock') return super.send(envelope);
    if (!this.fetchImpl) throw new Error('fetch indisponible.');
    const response = await this.fetchImpl(this.resolveUrl('events'), {
      method: 'POST',
      headers: await this.headers(),
      body: JSON.stringify(envelope),
    });
    if (!response.ok) throw new Error(`${this.moduleName}: HTTP ${response.status}`);
    const result = response.status === 204 ? { accepted: true } : await response.json();
    this.sent.push(structuredClone(envelope));
    this.lastSuccessAt = new Date().toISOString();
    return result;
  }

  async pull(params = {}) {
    if (!this.enabled) throw new Error(`Connecteur ${this.moduleName} désactivé.`);
    if (this.mode === 'mock') return super.pull(params);
    const url = new URL(this.resolveUrl('snapshot'));
    for (const [key, value] of Object.entries(params)) if (value !== undefined && value !== null) url.searchParams.set(key, String(value));
    const response = await this.fetchImpl(url, { headers: await this.headers() });
    if (!response.ok) throw new Error(`${this.moduleName}: HTTP ${response.status}`);
    const result = await response.json();
    this.received.push(structuredClone(result));
    this.lastSuccessAt = new Date().toISOString();
    return result;
  }
}

// ---- src/integrations/mappers.js ----
function projectFor(state, projectId) {
  return state.projects.find((project) => project.id === projectId) ?? null;
}

function assignmentFor(state, assignmentId) {
  return state.assignments.find((assignment) => assignment.id === assignmentId) ?? null;
}

function plannedHours(start, end) {
  const milliseconds = Math.max(0, new Date(end).getTime() - new Date(start).getTime());
  return Math.round((milliseconds / 3_600_000) * 100) / 100;
}

function buildAssignmentPayload(state, assignment) {
  const project = projectFor(state, assignment.projectId);
  return {
    assignmentId: assignment.id,
    calendarEventId: assignment.calendarEventId,
    projectId: assignment.projectId,
    projectName: project?.name ?? '',
    start: assignment.start,
    end: assignment.end,
    status: assignment.status,
    memberIds: resolveAssignmentMembers(state, assignment),
    crewIds: assignment.crewIds ?? [],
    notes: assignment.notes ?? '',
    datesLockedByAgenda: true,
  };
}

function buildPlanningPublication(state) {
  return {
    generatedAt: new Date().toISOString(),
    assignments: state.assignments.map((assignment) => buildAssignmentPayload(state, assignment)),
    containsActualWorkedTime: false,
  };
}

function buildPlannedLaborPayload(state, assignment) {
  const members = resolveAssignmentMembers(state, assignment);
  const totalWindowHours = plannedHours(assignment.start, assignment.end);
  return {
    assignmentId: assignment.id,
    calendarEventId: assignment.calendarEventId,
    projectId: assignment.projectId,
    memberIds: members,
    plannedWindowHours: totalWindowHours,
    plannedHoursPerMember: members.length ? Math.round((totalWindowHours / members.length) * 100) / 100 : 0,
    actualHours: null,
    source: 'planning_estimate',
  };
}

function mapAuditToOutboundEvents(state, audit) {
  const events = [];
  const suggestion = audit.entityType === 'suggestion' ? state.suggestions.find((item) => item.id === audit.entityId) : null;
  const assignment = audit.entityType === 'assignment'
    ? assignmentFor(state, audit.entityId)
    : audit.action === 'assignment.suggestion.approved' && suggestion
      ? assignmentFor(state, suggestion.assignmentId)
      : null;

  if (assignment && ['assignment.team.updated', 'assignment.team.cleared', 'assignment.suggestion.approved'].includes(audit.action)) {
    const payload = buildAssignmentPayload(state, assignment);
    events.push({ target: SPEEDARTI_MODULES.AGENDA_CHANTIER, eventType: OUTBOUND_EVENTS.ASSIGNMENT_UPDATED, payload });
    events.push({ target: SPEEDARTI_MODULES.TEMPS_PRESENCE, eventType: OUTBOUND_EVENTS.PLANNING_PUBLISHED, payload: { assignments: [payload], containsActualWorkedTime: false } });
    events.push({ target: SPEEDARTI_MODULES.COMPTABILITE, eventType: OUTBOUND_EVENTS.PLANNED_LABOR_UPDATED, payload: buildPlannedLaborPayload(state, assignment) });
  }

  if (audit.action === 'report.created') {
    const report = state.reports.find((item) => item.id === audit.entityId);
    if (report) {
      events.push({
        target: SPEEDARTI_MODULES.AGENDA_CHANTIER,
        eventType: OUTBOUND_EVENTS.REPORT_CREATED,
        payload: { ...report, attachments: (report.attachments ?? []).map(({ id, name, type, size }) => ({ id, name, type, size })) },
      });
      events.push({
        target: SPEEDARTI_MODULES.NOTIFICATIONS,
        eventType: OUTBOUND_EVENTS.NOTIFICATION_REQUESTED,
        payload: { template: 'team_report_submitted', recipients: ['owner'], projectId: report.projectId, reportId: report.id },
      });
      for (const attachment of report.attachments ?? []) {
        events.push({
          target: SPEEDARTI_MODULES.DOCUMENTS,
          eventType: OUTBOUND_EVENTS.DOCUMENT_UPLOAD_REQUESTED,
          payload: { entityType: 'report', entityId: report.id, projectId: report.projectId, attachmentId: attachment.id, name: attachment.name, type: attachment.type, size: attachment.size, validationRequired: false },
        });
      }
    }
  }

  if (audit.action === 'request.created') {
    const request = state.requests.find((item) => item.id === audit.entityId);
    if (request?.type === 'material') {
      const basePayload = { requestId: request.id, projectId: request.projectId, description: request.description, title: request.title, priority: request.priority };
      events.push({ target: SPEEDARTI_MODULES.STOCK, eventType: OUTBOUND_EVENTS.MATERIAL_AVAILABILITY_REQUESTED, payload: basePayload });
      events.push({ target: SPEEDARTI_MODULES.CATALOGUE, eventType: OUTBOUND_EVENTS.CATALOGUE_SEARCH_REQUESTED, payload: basePayload });
    }
    if (request?.type === 'unexpected_absence') {
      events.push({ target: SPEEDARTI_MODULES.RH, eventType: OUTBOUND_EVENTS.ABSENCE_REPORTED, payload: { requestId: request.id, projectId: request.projectId, description: request.description, authorId: request.authorId, status: 'to_validate' } });
    }
    if (request) {
      events.push({ target: SPEEDARTI_MODULES.NOTIFICATIONS, eventType: OUTBOUND_EVENTS.NOTIFICATION_REQUESTED, payload: { template: 'team_request_created', recipients: ['owner'], requestId: request.id, projectId: request.projectId, priority: request.priority } });
      for (const attachment of request.attachments ?? []) {
        events.push({ target: SPEEDARTI_MODULES.DOCUMENTS, eventType: OUTBOUND_EVENTS.DOCUMENT_UPLOAD_REQUESTED, payload: { entityType: 'request', entityId: request.id, projectId: request.projectId, attachmentId: attachment.id, name: attachment.name, type: attachment.type, size: attachment.size } });
      }
    }
  }

  if (audit.action === 'request.order.prepared') {
    const request = state.requests.find((item) => item.id === audit.entityId);
    if (request) events.push({ target: SPEEDARTI_MODULES.COMMANDES, eventType: OUTBOUND_EVENTS.ORDER_DRAFT_REQUESTED, payload: { requestId: request.id, projectId: request.projectId, description: request.description, validationRequired: true } });
  }

  if (audit.action === 'request.stock.checked') {
    const request = state.requests.find((item) => item.id === audit.entityId);
    if (request) events.push({ target: SPEEDARTI_MODULES.STOCK, eventType: OUTBOUND_EVENTS.MATERIAL_AVAILABILITY_REQUESTED, payload: { requestId: request.id, projectId: request.projectId, description: request.description } });
  }

  if (audit.action === 'message.sent') {
    const message = state.messages.find((item) => item.id === audit.entityId);
    if (message) {
      events.push({ target: SPEEDARTI_MODULES.NOTIFICATIONS, eventType: OUTBOUND_EVENTS.NOTIFICATION_REQUESTED, payload: { template: 'team_message_received', recipients: message.recipientIds, messageId: message.id, projectId: message.projectId } });
      for (const attachment of message.attachments ?? []) {
        events.push({ target: SPEEDARTI_MODULES.DOCUMENTS, eventType: OUTBOUND_EVENTS.DOCUMENT_UPLOAD_REQUESTED, payload: { entityType: 'message', entityId: message.id, projectId: message.projectId, attachmentId: attachment.id, name: attachment.name, type: attachment.type, size: attachment.size } });
      }
    }
  }

  if (['member.saved', 'member.availability.updated', 'member.permissions.updated'].includes(audit.action)) {
    const member = state.members.find((item) => item.id === audit.entityId);
    if (member) events.push({ target: SPEEDARTI_MODULES.RH, eventType: OUTBOUND_EVENTS.OPERATIONAL_PROFILE_UPDATED, payload: { memberId: member.id, skills: member.skills, availability: member.availability, projectAccessMode: member.projectAccessMode, projectAccessIds: member.projectAccessIds, requiresRhValidation: true } });
  }

  if (audit.action === 'assignment.suggestions.generated') {
    const shortages = state.suggestions.filter((suggestion) => suggestion.type === 'reinforcement' || suggestion.reason?.toLowerCase().includes('renfort'));
    for (const suggestion of shortages) {
      events.push({ target: SPEEDARTI_MODULES.SOUS_TRAITANCE, eventType: OUTBOUND_EVENTS.REINFORCEMENT_REQUESTED, payload: { suggestionId: suggestion.id, assignmentId: suggestion.assignmentId, projectId: suggestion.projectId, requiredSkills: suggestion.requiredSkills ?? [], validationRequired: true } });
    }
  }

  if (audit.action === 'angel.question.asked') {
    const conversation = state.angelConversations.find((item) => item.response?.title === audit.entityId) ?? state.angelConversations[0];
    if (conversation) events.push({ target: SPEEDARTI_MODULES.ANGEL, eventType: OUTBOUND_EVENTS.ANGEL_CONTEXT_REQUESTED, payload: { question: conversation.question, localResponse: conversation.response, contextPolicy: 'authorized_team_data_only', executeActions: false } });
  }

  return events;
}
