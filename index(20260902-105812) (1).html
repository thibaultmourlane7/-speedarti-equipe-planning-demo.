  handleClick(event) {
    if (event.target.matches?.('[data-modal-backdrop]')) {
      this.modal = null;
      this.render();
      return;
    }
    const viewTarget = event.target.closest('[data-view]');
    if (viewTarget) {
      this.navigate(viewTarget.dataset.view);
      return;
    }
    const target = event.target.closest('[data-action]');
    if (!target) return;
    const { action, id } = target.dataset;
    const state = this.store.getState();

    const actions = {
      'close-modal': () => { this.modal = null; this.render(); },
      'go-back': () => this.goBack(),
      'open-more-menu': () => this.openMoreMenu(state),
      'clear-search': () => { this.searchQuery = ''; this.render(); },
      'open-search-result': () => this.openSearchResult(target),
      'filter-terrain-project': () => { this.terrainProjectFilter = target.dataset.projectId || 'all'; this.navigate('terrain'); },
      'open-member': () => this.openMemberForm(state),
      'edit-member': () => this.openMemberForm(state, id),
      'open-availability': () => this.openAvailabilityForm(state, id),
      'open-member-permissions': () => this.openMemberPermissionsForm(state, id),
      'delete-unavailability': () => this.deleteUnavailability(target.dataset.memberId, target.dataset.periodId),
      'open-crew': () => this.openCrewForm(state),
      'edit-crew': () => this.openCrewForm(state, id),
      'delete-crew': () => this.deleteCrew(id),
      'open-assignment': () => this.openAssignmentForm(state),
      'edit-assignment': () => this.openAssignmentForm(state, id),
      'delete-assignment': () => this.deleteAssignment(id),
      'open-report': () => this.openReportForm(state),
      'analyze-report': () => this.analyzeExistingReport(id),
      'detect-missing-reports': () => this.detectMissingReports(),
      'remind-missing-report': () => this.remindMissingReport(target.dataset.assignmentId, target.dataset.memberId),
      'apply-report-action': () => this.applyReportAction(target.dataset.reportId, target.dataset.actionId),
      'open-request': () => this.openRequestForm(state),
      'material-stock-check': () => this.simulateStockCheck(id),
      'prepare-order': () => this.prepareOrder(id),
      'open-task': () => this.openTaskForm(state),
      'open-message': () => this.openMessageForm(state),
      'analyze-message': () => this.analyzeExistingMessage(id),
      'apply-message-action': () => this.applyMessageAction(target.dataset.messageId, target.dataset.actionId),
      'generate-suggestions': () => this.generateSuggestions(),
      'approve-suggestion': () => this.approveSuggestion(id),
      'reject-suggestion': () => this.rejectSuggestion(id),
      'mark-notification': () => this.markNotification(id),
      'mark-all-read': () => this.markAllRead(),
      'set-edition': () => this.setEdition(target.dataset.value),
      'export-data': () => this.exportData(),
      'reset-data': () => this.resetData(),
      'dictate-summary': () => this.startDictation(),
      'download-attachment': () => this.downloadAttachmentFile(id),
    };
    actions[action]?.();
  }

  handleChange(event) {
    const target = event.target;
    const control = target.dataset?.control;
    if (!control) return;
    if (control === 'active-member') {
      this.store.update((state) => { state.session.activeMemberId = target.value; }, { action: 'session.member.changed', entityType: 'member', entityId: target.value });
    }
    if (control === 'toggle-task') {
      this.store.update((state) => {
        const task = state.tasks.find((item) => item.id === target.dataset.id);
        if (task) task.status = target.checked ? 'completed' : 'open';
      }, { action: 'task.status.changed', entityType: 'task', entityId: target.dataset.id });
    }
    if (control === 'request-status') {
      this.store.update((state) => {
        const request = state.requests.find((item) => item.id === target.dataset.id);
        if (request) request.status = target.value;
      }, { action: 'request.status.changed', entityType: 'request', entityId: target.dataset.id });
    }
    if (control === 'audit-filter') {
      this.auditFilter = target.value;
      this.render();
    }
    if (control === 'message-filter') {
      this.messageProjectFilter = target.value;
      this.render();
    }
    if (control === 'terrain-project-filter') {
      this.terrainProjectFilter = target.value;
      this.render();
    }
    if (control === 'role-permission') {
      this.store.update((state) => {
        const role = target.dataset.role;
        const permission = target.dataset.permission;
        const set = new Set(state.settings.rolePermissions[role] ?? []);
        if (target.checked) set.add(permission); else set.delete(permission);
        state.settings.rolePermissions[role] = [...set];
      }, { action: 'permissions.updated', entityType: 'role', entityId: target.dataset.role, details: target.dataset.permission });
    }
    if (control === 'import-data') this.importData(target.files?.[0]);
  }

  async handleSubmit(event) {
    const form = event.target.closest('form[data-form]');
    if (!form) return;
    event.preventDefault();
    const data = new FormData(form);
    const handlers = {
      member: () => this.saveMember(data),
      availability: () => this.saveAvailability(data),
      'member-permissions': () => this.saveMemberPermissions(data),
      crew: () => this.saveCrew(data),
      assignment: () => this.saveAssignment(data),
      report: () => this.saveReport(data),
      request: () => this.saveRequest(data),
      task: () => this.saveTask(data),
      message: () => this.saveMessage(data),
      'global-search': () => { this.searchQuery = String(data.get('query') || '').trim(); this.render(); },
    };
    try {
      await handlers[form.dataset.form]?.();
    } catch (error) {
      this.notify(error instanceof Error ? error.message : 'Une erreur est survenue.', 'error');
    }
  }


  openMoreMenu(state) {
    this.modal = `<div class="more-menu"><h2>Plus d’options</h2><p>Les fonctions avancées restent accessibles sans encombrer la navigation principale.</p><div class="more-menu-grid">${can(state, PERMISSIONS.VIEW_AUDIT) ? '<button class="menu-tile" data-view="history"><span>↺</span><strong>Historique</strong><small>Traçabilité des actions</small></button>' : ''}${can(state, PERMISSIONS.MANAGE_SETTINGS) ? '<button class="menu-tile" data-view="settings"><span>⚙</span><strong>Configuration</strong><small>Rôles, droits et données</small></button>' : ''}<button class="menu-tile" data-view="pilotage"><span>◉</span><strong>Notifications</strong><small>Alertes et points de contrôle</small></button></div></div>`;
    this.render();
  }

  openSearchResult(target) {
    const kind = target.dataset.kind;
    const projectId = target.dataset.projectId;
    if (kind === 'member') return this.navigate('team');
    if (kind === 'assignment') return this.navigate('planning');
    if (projectId) this.terrainProjectFilter = projectId;
    this.navigate('terrain');
  }

  openMessageForm(state) {
    const projects = visibleProjects(state);
    const preferredProjectId = this.terrainProjectFilter !== 'all' ? this.terrainProjectFilter : projects[0]?.id;
    this.modal = `<form data-form="message"><h2>Nouveau message interne</h2><div class="form-grid"><label>Chantier<select name="projectId" required>${projects.map((project) => `<option value="${project.id}" ${project.id === preferredProjectId ? 'selected' : ''}>${escapeHtml(project.name)}</option>`).join('')}</select></label><label>Destinataires<select name="recipientIds" multiple required>${state.members.filter((member) => member.id !== state.session.activeMemberId && member.status === 'active').map((member) => `<option value="${member.id}">${escapeHtml(member.name)}</option>`).join('')}</select></label><label class="full-span">Message<textarea name="body" required placeholder="Information terrain, question, problème…"></textarea></label><label class="full-span">Photos ou documents<input type="file" name="attachments" multiple /></label></div><p class="form-hint">La messagerie équipe reste séparée de la messagerie client.</p><div class="modal-actions"><button type="button" class="ghost" data-action="close-modal">Annuler</button><button class="primary" type="submit">Envoyer</button></div></form>`;
    this.render();
  }

  openMemberForm(state, id = null) {
    const member = state.members.find((item) => item.id === id) ?? { id: '', name: '', email: '', phone: '', role: 'worker', skills: [], status: 'active', color: '#1167ff', projectAccessMode: 'assigned', projectAccessIds: [], permissionOverrides: {}, availability: { weeklyHours: 35, workingDays: [1, 2, 3, 4, 5], unavailablePeriods: [] } };
    this.modal = `<form data-form="member"><h2>${id ? 'Modifier le collaborateur' : 'Ajouter un collaborateur'}</h2><input type="hidden" name="id" value="${escapeHtml(member.id)}"/><div class="form-grid"><label>Nom complet<input name="name" required value="${escapeHtml(member.name)}"/></label><label>E-mail<input name="email" type="email" value="${escapeHtml(member.email)}"/></label><label>Téléphone<input name="phone" value="${escapeHtml(member.phone)}"/></label><label>Rôle<select name="role">${optionList(ROLES, member.role)}</select></label><label class="full-span">Compétences, séparées par des virgules<input name="skills" value="${escapeHtml((member.skills ?? []).join(', '))}" placeholder="Couverture, Charpente, Zinguerie"/></label><label>Statut<select name="status"><option value="active" ${member.status === 'active' ? 'selected' : ''}>Actif</option><option value="inactive" ${member.status === 'inactive' ? 'selected' : ''}>Inactif</option></select></label><label>Couleur<input name="color" type="color" value="${escapeHtml(member.color || '#1167ff')}"/></label><label class="full-span">Accès aux chantiers<select name="projectAccessMode"><option value="role" ${member.projectAccessMode === 'role' ? 'selected' : ''}>Selon les droits du rôle</option><option value="assigned" ${member.projectAccessMode === 'assigned' ? 'selected' : ''}>Uniquement les chantiers où il est affecté</option><option value="selected" ${member.projectAccessMode === 'selected' ? 'selected' : ''}>Uniquement les chantiers sélectionnés ci-dessous</option><option value="all" ${member.projectAccessMode === 'all' ? 'selected' : ''}>Tous les chantiers</option></select></label></div><fieldset><legend>Chantiers sélectionnés</legend><div class="checkbox-grid">${state.projects.map((project) => `<label><input type="checkbox" name="projectAccessIds" value="${project.id}" ${(member.projectAccessIds ?? []).includes(project.id) ? 'checked' : ''}/> ${escapeHtml(project.name)}</label>`).join('')}</div></fieldset><div class="modal-actions"><button type="button" class="ghost" data-action="close-modal">Annuler</button><button class="primary" type="submit">Enregistrer</button></div></form>`;
    this.render();
  }

  saveMember(data) {
    const id = String(data.get('id') || uid('member'));
    const record = { id, name: String(data.get('name')).trim(), email: String(data.get('email')).trim(), phone: String(data.get('phone')).trim(), role: String(data.get('role')), skills: String(data.get('skills')).split(',').map((item) => item.trim()).filter(Boolean), status: String(data.get('status')), color: String(data.get('color')), projectAccessMode: String(data.get('projectAccessMode') || 'assigned'), projectAccessIds: data.getAll('projectAccessIds').map(String) };
    this.store.update((state) => {
      const index = state.members.findIndex((item) => item.id === id);
      if (index >= 0) state.members[index] = { ...state.members[index], ...record };
      else state.members.push({ ...record, permissionOverrides: {}, availability: { weeklyHours: 35, workingDays: [1, 2, 3, 4, 5], unavailablePeriods: [] } });
    }, { action: 'member.saved', entityType: 'member', entityId: id, details: record.name });
    this.modal = null; this.notify('Collaborateur enregistré.');
  }

  openAvailabilityForm(state, memberId) {
    const member = state.members.find((item) => item.id === memberId);
    if (!member) return;
    const availability = member.availability ?? { weeklyHours: 35, workingDays: [1, 2, 3, 4, 5], unavailablePeriods: [] };
    this.modal = `<form data-form="availability"><h2>Disponibilités de ${escapeHtml(member.name)}</h2><input type="hidden" name="memberId" value="${member.id}"/><div class="form-grid"><label>Capacité hebdomadaire prévisionnelle<input type="number" min="1" max="80" name="weeklyHours" value="${availability.weeklyHours ?? 35}" required/></label><label class="full-span">Jours habituels<div class="checkbox-grid">${Object.entries(WORKDAY_LABELS).map(([value, label]) => `<label><input type="checkbox" name="workingDays" value="${value}" ${(availability.workingDays ?? []).includes(Number(value)) ? 'checked' : ''}/> ${escapeHtml(label)}</label>`).join('')}</div></label></div><fieldset><legend>Indisponibilités déclarées</legend>${availability.unavailablePeriods?.length ? `<div class="stack compact">${availability.unavailablePeriods.map((period) => `<div class="missing-row"><span><strong>${escapeHtml(period.reason || 'Indisponibilité')}</strong><small>${formatDateTime(period.start)} → ${formatDateTime(period.end)}</small></span><button type="button" class="ghost danger-text" data-action="delete-unavailability" data-member-id="${member.id}" data-period-id="${period.id}">Supprimer</button></div>`).join('')}</div>` : this.empty('Aucune indisponibilité déclarée.')}<div class="form-grid availability-add"><label>Nouvelle indisponibilité — début<input type="datetime-local" name="unavailableStart"/></label><label>Fin<input type="datetime-local" name="unavailableEnd"/></label><label class="full-span">Motif<input name="unavailableReason" placeholder="Ex. formation, congé, indisponibilité personnelle"/></label></div></fieldset><p class="form-hint">Ces données servent uniquement à l’organisation prévisionnelle. Elles ne remplacent ni les congés RH ni le pointage.</p><div class="modal-actions"><button type="button" class="ghost" data-action="close-modal">Annuler</button><button class="primary" type="submit">Enregistrer</button></div></form>`;
    this.render();
  }

  saveAvailability(data) {
    const memberId = String(data.get('memberId'));
    const workingDays = data.getAll('workingDays').map(Number);
    if (!workingDays.length) throw new Error('Sélectionnez au moins un jour habituel.');
    const startRaw = String(data.get('unavailableStart') || '');
    const endRaw = String(data.get('unavailableEnd') || '');
    if ((startRaw && !endRaw) || (!startRaw && endRaw)) throw new Error('Renseignez le début et la fin de l’indisponibilité.');
    if (startRaw && new Date(endRaw) <= new Date(startRaw)) throw new Error('La fin de l’indisponibilité doit être postérieure au début.');
    this.store.update((state) => {
      const member = state.members.find((item) => item.id === memberId);
      if (!member) return;
      member.availability ??= { weeklyHours: 35, workingDays: [1, 2, 3, 4, 5], unavailablePeriods: [] };
      member.availability.weeklyHours = Number(data.get('weeklyHours'));
      member.availability.workingDays = workingDays;
      if (startRaw) member.availability.unavailablePeriods.push({ id: uid('unavailable'), start: new Date(startRaw).toISOString(), end: new Date(endRaw).toISOString(), reason: String(data.get('unavailableReason') || 'Indisponibilité déclarée').trim() });
    }, { action: 'member.availability.updated', entityType: 'member', entityId: memberId });
    this.modal = null; this.notify('Disponibilités enregistrées.');
  }

  deleteUnavailability(memberId, periodId) {
    this.store.update((state) => {
      const member = state.members.find((item) => item.id === memberId);
      if (member?.availability) member.availability.unavailablePeriods = member.availability.unavailablePeriods.filter((period) => period.id !== periodId);
    }, { action: 'member.unavailability.deleted', entityType: 'member', entityId: memberId, details: periodId });
    this.modal = null; this.notify('Indisponibilité supprimée.', 'info');
  }

  openMemberPermissionsForm(state, memberId) {
    const member = state.members.find((item) => item.id === memberId);
    if (!member) return;
    const permissions = Object.values(PERMISSIONS);
    this.modal = `<form data-form="member-permissions"><h2>Droits individuels — ${escapeHtml(member.name)}</h2><input type="hidden" name="memberId" value="${member.id}"/><p class="form-hint">« Hériter » utilise les droits du rôle. Une autorisation ou un refus individuel prend le dessus.</p><div class="permission-overrides">${permissions.map((permission) => { const value = member.permissionOverrides?.[permission]; return `<label><span>${escapeHtml(permission)}</span><select name="permission:${permission}"><option value="inherit" ${value === undefined ? 'selected' : ''}>Hériter du rôle</option><option value="allow" ${value === true ? 'selected' : ''}>Autoriser</option><option value="deny" ${value === false ? 'selected' : ''}>Refuser</option></select></label>`; }).join('')}</div><div class="modal-actions"><button type="button" class="ghost" data-action="close-modal">Annuler</button><button class="primary" type="submit">Enregistrer les droits</button></div></form>`;
    this.render();
  }

  saveMemberPermissions(data) {
    const memberId = String(data.get('memberId'));
    const overrides = {};
    for (const permission of Object.values(PERMISSIONS)) {
      const value = String(data.get(`permission:${permission}`) || 'inherit');
      if (value === 'allow') overrides[permission] = true;
      if (value === 'deny') overrides[permission] = false;
    }
    this.store.update((state) => { const member = state.members.find((item) => item.id === memberId); if (member) member.permissionOverrides = overrides; }, { action: 'member.permissions.updated', entityType: 'member', entityId: memberId });
    this.modal = null; this.notify('Droits individuels enregistrés.');
  }


  openCrewForm(state, id = null) {
    const crew = state.crews.find((item) => item.id === id) ?? { id: '', name: '', memberIds: [], specialties: [] };
    this.modal = `<form data-form="crew"><h2>${id ? 'Modifier l’équipe' : 'Créer une équipe'}</h2><input type="hidden" name="id" value="${escapeHtml(crew.id)}"/><label>Nom de l’équipe<input name="name" required value="${escapeHtml(crew.name)}"/></label><label>Spécialités<input name="specialties" value="${escapeHtml((crew.specialties ?? []).join(', '))}"/></label><fieldset><legend>Membres</legend><div class="checkbox-grid">${state.members.filter((member) => member.status === 'active').map((member) => `<label><input type="checkbox" name="memberIds" value="${member.id}" ${crew.memberIds.includes(member.id) ? 'checked' : ''}/> ${escapeHtml(member.name)}</label>`).join('')}</div></fieldset><div class="modal-actions"><button type="button" class="ghost" data-action="close-modal">Annuler</button><button class="primary" type="submit">Enregistrer</button></div></form>`;
    this.render();
  }

  saveCrew(data) {
    const id = String(data.get('id') || uid('crew'));
    const record = { id, name: String(data.get('name')).trim(), memberIds: data.getAll('memberIds').map(String), specialties: String(data.get('specialties')).split(',').map((item) => item.trim()).filter(Boolean) };
    this.store.update((state) => {
      const index = state.crews.findIndex((item) => item.id === id);
      if (index >= 0) state.crews[index] = record; else state.crews.push(record);
    }, { action: 'crew.saved', entityType: 'crew', entityId: id, details: record.name });
    this.modal = null; this.notify('Équipe enregistrée.');
  }

  deleteCrew(id) {
    if (!confirm('Supprimer cette équipe ? Les interventions existantes conserveront leurs collaborateurs explicites uniquement.')) return;
    this.store.update((state) => { state.crews = state.crews.filter((crew) => crew.id !== id); }, { action: 'crew.deleted', entityType: 'crew', entityId: id });
    this.notify('Équipe supprimée.');
  }

  openProjectForm(state, id = null) {
    const project = state.projects.find((item) => item.id === id) ?? { id: '', name: '', client: '', address: '', startDate: nowIso(), endDate: nowIso(), status: 'preparation', priority: 'normal', requiredSkills: [], notes: '' };
    this.modal = `<form data-form="project"><h2>${id ? 'Modifier le chantier' : 'Ajouter un chantier autonome'}</h2><input type="hidden" name="id" value="${escapeHtml(project.id)}"/><div class="form-grid"><label>Nom du chantier<input name="name" required value="${escapeHtml(project.name)}"/></label><label>Client<input name="client" value="${escapeHtml(project.client || '')}"/></label><label class="full-span">Adresse<input name="address" value="${escapeHtml(project.address || '')}"/></label><label>Début<input type="datetime-local" name="startDate" required value="${toLocalDateTime(project.startDate)}"/></label><label>Fin<input type="datetime-local" name="endDate" required value="${toLocalDateTime(project.endDate)}"/></label><label>Statut<select name="status">${optionList(PROJECT_STATUSES, project.status)}</select></label><label>Priorité<select name="priority">${optionList(PRIORITIES, project.priority)}</select></label><label class="full-span">Compétences nécessaires<input name="requiredSkills" value="${escapeHtml((project.requiredSkills ?? []).join(', '))}" placeholder="Couverture, Charpente"/></label><label class="full-span">Notes<textarea name="notes">${escapeHtml(project.notes || '')}</textarea></label></div><div class="modal-actions"><button type="button" class="ghost" data-action="close-modal">Annuler</button><button class="primary" type="submit">Enregistrer</button></div></form>`;
    this.render();
  }

  saveProject(data) {
    const id = String(data.get('id') || uid('project'));
    const startDate = new Date(String(data.get('startDate'))).toISOString();
    const endDate = new Date(String(data.get('endDate'))).toISOString();
    if (new Date(endDate) <= new Date(startDate)) throw new Error('La date de fin doit être postérieure à la date de début.');
    const record = { id, name: String(data.get('name')).trim(), client: String(data.get('client')).trim(), address: String(data.get('address')).trim(), startDate, endDate, status: String(data.get('status')), priority: String(data.get('priority')), requiredSkills: String(data.get('requiredSkills')).split(',').map((item) => item.trim()).filter(Boolean), notes: String(data.get('notes')).trim(), source: 'standalone' };
    this.store.update((state) => {
      const index = state.projects.findIndex((item) => item.id === id);
      if (index >= 0) state.projects[index] = { ...state.projects[index], ...record }; else state.projects.push(record);
    }, { action: 'project.saved', entityType: 'project', entityId: id, details: record.name });
    this.modal = null; this.notify('Chantier enregistré.');
  }

  deleteProject(id) {
    const state = this.store.getState();
    if (state.assignments.some((assignment) => assignment.projectId === id)) {
      this.notify('Supprimez d’abord les interventions liées à ce chantier.', 'error');
      return;
    }
    if (!confirm('Supprimer ce chantier autonome ?')) return;
    this.store.update((next) => { next.projects = next.projects.filter((project) => project.id !== id); }, { action: 'project.deleted', entityType: 'project', entityId: id });
    this.notify('Chantier supprimé.');
  }

  openAssignmentForm(state, id = null) {
    const candidates = id
      ? state.assignments.filter((item) => item.id === id)
      : state.assignments.filter((item) => resolveAssignmentMembers(state, item).length === 0);
    if (!candidates.length) {
      this.notify('Toutes les interventions de l’Agenda Chantier ont déjà une équipe.', 'info');
      return;
    }
    const assignment = candidates[0];
    const project = state.projects.find((item) => item.id === assignment.projectId);
    this.modal = `<form data-form="assignment"><h2>${id ? 'Modifier l’affectation' : 'Affecter une équipe'}</h2><input type="hidden" name="id" value="${escapeHtml(assignment.id)}"/>
      ${!id && candidates.length > 1 ? `<label>Intervention de l’Agenda Chantier<select name="sourceAssignmentId" data-control="assignment-source">${candidates.map((item) => `<option value="${item.id}">${escapeHtml(item.title)} — ${escapeHtml(projectName(state, item.projectId))} — ${formatDateTime(item.start)}</option>`).join('')}</select></label>` : ''}
      <div class="calendar-event-summary"><span>Agenda Chantier</span><strong>${escapeHtml(assignment.title)}</strong><p>${escapeHtml(project?.name ?? '')} · ${formatDateTime(assignment.start)} → ${formatDateTime(assignment.end)}</p><small>Les dates et l’intitulé se modifient uniquement dans le calendrier chantier.</small></div>
      <fieldset><legend>Équipes</legend><div class="checkbox-grid">${state.crews.map((crew) => `<label><input type="checkbox" name="crewIds" value="${crew.id}" ${assignment.crewIds?.includes(crew.id) ? 'checked' : ''}/> ${escapeHtml(crew.name)}</label>`).join('') || '<small>Aucune équipe créée.</small>'}</div></fieldset>
      <fieldset><legend>Collaborateurs supplémentaires</legend><div class="checkbox-grid">${state.members.filter((member) => member.status === 'active').map((member) => `<label><input type="checkbox" name="memberIds" value="${member.id}" ${assignment.memberIds?.includes(member.id) ? 'checked' : ''}/> ${escapeHtml(member.name)}</label>`).join('')}</div></fieldset>
      <label>Note d’affectation<textarea name="notes" placeholder="Consigne interne, matériel ou accès…">${escapeHtml(assignment.notes || '')}</textarea></label>
      <div class="modal-actions"><button type="button" class="ghost" data-action="close-modal">Annuler</button><button class="primary" type="submit">Enregistrer l’affectation</button></div></form>`;
    this.render();
  }

  saveAssignment(data) {
    const id = String(data.get('sourceAssignmentId') || data.get('id'));
    const currentState = this.store.getState();
    const existing = currentState.assignments.find((item) => item.id === id);
    if (!existing) throw new Error('Intervention de l’Agenda Chantier introuvable.');
    const record = {
      ...existing,
      crewIds: data.getAll('crewIds').map(String),
      memberIds: data.getAll('memberIds').map(String),
      notes: String(data.get('notes')).trim(),
    };
    if (!resolveAssignmentMembers(currentState, record).length) throw new Error('Sélectionnez au moins une équipe ou un collaborateur.');
    const conflicts = detectAssignmentConflicts(currentState, record, id);
    if (conflicts.length && !confirm(`${conflicts.length} conflit(s) d’affectation détecté(s). Enregistrer quand même ?`)) return;
    this.store.update((state) => {
      const index = state.assignments.findIndex((item) => item.id === id);
      state.assignments[index] = record;
      state.notifications.unshift({ id: uid('notification'), type: conflicts.length ? 'warning' : 'success', title: conflicts.length ? 'Conflit d’affectation accepté' : 'Équipe affectée', body: `${record.title} — ${projectName(state, record.projectId)}`, priority: conflicts.length ? 'high' : 'normal', createdAt: nowIso(), read: false, entityType: 'assignment', entityId: id });
    }, { action: 'assignment.team.updated', entityType: 'assignment', entityId: id, details: record.title });
    this.modal = null; this.notify('Affectation enregistrée dans la vue équipe.');
  }

  deleteAssignment(id) {
    if (!confirm('Retirer l’équipe de cette intervention ? L’intervention restera dans l’Agenda Chantier.')) return;
    this.store.update((state) => {
      const assignment = state.assignments.find((item) => item.id === id);
      if (assignment) { assignment.memberIds = []; assignment.crewIds = []; assignment.notes = ''; }
    }, { action: 'assignment.team.cleared', entityType: 'assignment', entityId: id });
    this.notify('Affectation retirée. L’intervention du calendrier est conservée.', 'info');
  }

  openReportForm(state) {
    const assignments = state.assignments.filter((assignment) => resolveAssignmentMembers(state, assignment).includes(state.session.activeMemberId) || can(state, PERMISSIONS.VIEW_ALL_PROJECTS));
    const preferredProjectId = this.terrainProjectFilter !== 'all' ? this.terrainProjectFilter : null;
    this.modal = `<form data-form="report"><h2>Nouveau rapport journalier</h2><div class="form-grid"><label class="full-span">Intervention de l’Agenda Chantier<select name="assignmentId" required>${assignments.map((assignment) => `<option value="${assignment.id}" ${preferredProjectId && assignment.projectId === preferredProjectId ? 'selected' : ''}>${escapeHtml(assignment.title)} — ${escapeHtml(projectName(state, assignment.projectId))}</option>`).join('')}</select></label><label>Date et heure<input type="datetime-local" name="date" required value="${toLocalDateTime(nowIso())}"/></label><label>Avancement (%)<input type="number" name="progress" min="0" max="100" value="50" required/></label><label class="full-span">Résumé<div class="dictation-row"><textarea id="report-summary" name="summary" required placeholder="Travaux réalisés aujourd’hui..."></textarea><button type="button" class="secondary" data-action="dictate-summary">🎙 Dicter</button></div></label><label class="full-span">Difficulté ou problème<textarea name="problems" placeholder="Laissez vide si aucun problème"></textarea></label><label class="full-span">Matériel manquant<textarea name="materials" placeholder="Ex. 40 tuiles"></textarea></label><label class="full-span">Photos ou documents<input type="file" name="attachments" multiple accept="image/*,.pdf,.doc,.docx"/></label></div><p class="form-hint">Le rapport est lié à une intervention existante de l’Agenda Chantier. Les fichiers sont conservés localement pour cette démonstration.</p><div class="modal-actions"><button type="button" class="ghost" data-action="close-modal">Annuler</button><button class="primary" type="submit">Transmettre</button></div></form>`;

  async saveReport(data) {
    const state = this.store.getState();
    const assignmentId = String(data.get('assignmentId'));
    const assignment = state.assignments.find((item) => item.id === assignmentId);
    if (!assignment) throw new Error('Intervention introuvable dans l’Agenda Chantier.');
    const attachments = await saveAttachments(data.getAll('attachments'));
    const report = { id: uid('report'), assignmentId, projectId: assignment.projectId, authorId: state.session.activeMemberId, date: new Date(String(data.get('date'))).toISOString(), progress: Number(data.get('progress')), summary: String(data.get('summary')).trim(), problems: String(data.get('problems')).trim(), materials: String(data.get('materials')).trim(), attachments, status: 'submitted', analysis: null };
    if (hasEdition(state, 'expert')) report.analysis = analyzeReport(report);
    this.store.update((next) => {
      next.reports.unshift(report);
      next.notifications.unshift({ id: uid('notification'), type: report.analysis?.priority === 'urgent' ? 'warning' : 'info', title: 'Nouveau rapport terrain', body: `${memberName(next, report.authorId)} — ${projectName(next, report.projectId)}`, priority: report.analysis?.priority ?? 'normal', createdAt: nowIso(), read: false, entityType: 'report', entityId: report.id });

  detectMissingReports() {
    const missing = findMissingReports(this.store.getState());
    this.store.update((state) => {
      for (const item of missing) {
        const existing = state.notifications.some((notification) => notification.entityType === 'missing_report' && notification.entityId === `${item.assignmentId}:${item.memberId}` && !notification.read);
        if (!existing) state.notifications.unshift({ id: uid('notification'), type: 'warning', title: 'Rapport terrain manquant', body: `${memberName(state, item.memberId)} — ${state.assignments.find((assignment) => assignment.id === item.assignmentId)?.title ?? 'Intervention'}`, priority: 'high', createdAt: nowIso(), read: false, entityType: 'missing_report', entityId: `${item.assignmentId}:${item.memberId}` });
      }
    }, { action: 'reports.missing.checked', entityType: 'report', entityId: 'batch', details: `${missing.length} rapport(s)` });
    this.notify(missing.length ? `${missing.length} rapport(s) manquant(s) signalé(s).` : 'Aucun rapport manquant.', missing.length ? 'info' : 'success');
  }

  remindMissingReport(assignmentId, memberId) {
    this.store.update((state) => {
      const assignment = state.assignments.find((item) => item.id === assignmentId);
      const ownerId = state.members.find((member) => member.role === 'owner')?.id ?? state.session.activeMemberId;
      state.messages.push({ id: uid('message'), projectId: assignment?.projectId ?? '', authorId: ownerId, recipientIds: [memberId], body: `Rappel : le rapport de l’intervention « ${assignment?.title ?? 'Intervention'} » est attendu.`, createdAt: nowIso(), readBy: [ownerId], attachments: [], analysis: null });
    }, { action: 'report.missing.reminder.sent', entityType: 'assignment', entityId: assignmentId, details: memberId });
    this.notify('Rappel envoyé dans la messagerie interne.');
  }


  analyzeExistingReport(id) {
    this.store.update((state) => {
      const report = state.reports.find((item) => item.id === id);
      if (report) report.analysis = analyzeReport(report);
    }, { action: 'report.analyzed', entityType: 'report', entityId: id });
    this.notify('Rapport analysé.');

  applyReportAction(reportId, actionId) {
    this.store.update((state) => {
      const report = state.reports.find((item) => item.id === reportId);
      const action = report?.analysis?.actions.find((item) => item.id === actionId);
      if (!report || !action || action.appliedAt) return;
      if (action.type === 'create_material_request') {
        const requestId = uid('request');
        state.requests.unshift({ id: requestId, projectId: report.projectId, authorId: report.authorId, type: 'material', title: action.title, description: action.description, priority: action.priority, status: 'open', createdAt: nowIso(), generatedFromReportId: report.id });
        window.dispatchEvent(new CustomEvent('speedarti:team-planning:material-request-created', { detail: { requestId, reportId } }));
      }
      if (action.type === 'notify_manager') {
        state.notifications.unshift({ id: uid('notification'), type: 'warning', title: 'Alerte rapport terrain', body: action.description, priority: action.priority, createdAt: nowIso(), read: false, entityType: 'report', entityId: report.id });
      }
      if (action.type === 'review_progress') {
        state.tasks.unshift({ id: uid('task'), projectId: report.projectId, title: action.title, description: action.description, assigneeId: state.members.find((member) => member.role === 'owner')?.id ?? state.session.activeMemberId, priority: action.priority, status: 'open', dueDate: report.date, createdAt: nowIso() });
      }
      action.appliedAt = nowIso();
      action.appliedBy = state.session.activeMemberId;
    }, { action: 'report.action.applied', entityType: 'report', entityId: reportId, details: actionId });
    this.notify('Action appliquée après validation.');
  }

  applyMessageAction(messageId, actionId) {
    this.store.update((state) => {
      const message = state.messages.find((item) => item.id === messageId);
      const action = message?.analysis?.actions.find((item) => item.id === actionId);
      if (!message || !action || action.appliedAt) return;
      if (action.type === 'create_material_request') state.requests.unshift({ id: uid('request'), projectId: message.projectId, authorId: message.authorId, type: 'material', title: action.title, description: action.description, priority: action.priority, status: 'open', attachments: message.attachments ?? [], createdAt: nowIso(), generatedFromMessageId: message.id });
      if (action.type === 'create_absence_request') state.requests.unshift({ id: uid('request'), projectId: message.projectId, authorId: message.authorId, type: 'unexpected_absence', title: action.title, description: action.description, priority: action.priority, status: 'open', attachments: message.attachments ?? [], createdAt: nowIso(), generatedFromMessageId: message.id });
      if (action.type === 'prepare_reorganization') state.tasks.unshift({ id: uid('task'), projectId: message.projectId, title: action.title, description: `${action.description} Message de ${memberName(state, message.authorId)}.`, assigneeId: state.members.find((member) => member.role === 'owner')?.id ?? state.session.activeMemberId, priority: action.priority, status: 'open', dueDate: nowIso(), createdAt: nowIso(), generatedFromMessageId: message.id });
      if (action.type === 'create_delay_task') state.tasks.unshift({ id: uid('task'), projectId: message.projectId, title: action.title, description: action.description, assigneeId: state.members.find((member) => member.role === 'owner')?.id ?? state.session.activeMemberId, priority: action.priority, status: 'open', dueDate: nowIso(), createdAt: nowIso(), generatedFromMessageId: message.id });
      if (action.type === 'notify_manager') state.notifications.unshift({ id: uid('notification'), type: 'warning', title: 'Alerte issue de la messagerie', body: action.description, priority: action.priority, createdAt: nowIso(), read: false, entityType: 'message', entityId: message.id });
      action.appliedAt = nowIso();
      action.appliedBy = state.session.activeMemberId;
    }, { action: 'message.action.applied', entityType: 'message', entityId: messageId, details: actionId });
    this.notify('Action créée après validation.');

    if (!clean) throw new Error('Écrivez une question.');

    if (!hasEdition(state, 'expert')) return this.notify('Ángel Collaborateurs nécessite le niveau Expert.', 'error');

    this.store.update((next) => { next.angelConversations.unshift({ id: uid('angel'), question: clean, response, createdAt: nowIso(), authorId: next.session.activeMemberId }); }, { action: 'angel.question.asked', entityType: 'angel', entityId: response.title, details: clean });
    this.notify('Réponse préparée pour Ángel SpeedArti.', 'info');

  generateSuggestions() {
    const state = this.store.getState();
    if (!hasEdition(state, 'ultra')) return this.notify('Le mode Ultra n’est pas actif.', 'error');
    const generated = buildPlanningSuggestions(state);
    this.store.update((next) => {
      next.suggestions = [...generated, ...next.suggestions.filter((suggestion) => suggestion.status !== 'pending')];
    }, { action: 'assignment.suggestions.generated', entityType: 'suggestion', entityId: 'batch', details: `${generated.length} suggestion(s)` });
    this.notify(generated.length ? `${generated.length} suggestion(s) créée(s).` : 'Aucune intervention sans équipe détectée.', generated.length ? 'success' : 'info');
  }

  approveSuggestion(id) {
    this.store.update((state) => {
      const suggestion = state.suggestions.find((item) => item.id === id);
      if (!suggestion || suggestion.status !== 'pending') return;
      const assignment = state.assignments.find((item) => item.id === suggestion.assignmentId);
      if (!assignment) throw new Error('L’intervention liée n’existe plus dans l’Agenda Chantier.');
      const existingMembers = resolveAssignmentMembers(state, assignment);
      const finalMembers = suggestion.type === 'reorganization'
        ? [...new Set([...existingMembers.filter((memberId) => !(suggestion.replaceMemberIds ?? []).includes(memberId)), ...suggestion.memberIds])]
        : [...suggestion.memberIds];
      const candidate = { ...assignment, memberIds: finalMembers, crewIds: [] };
      const conflicts = detectAssignmentConflicts(state, candidate, assignment.id);
      if (conflicts.length) throw new Error('La suggestion présente désormais un conflit. Relancez l’analyse.');
      assignment.memberIds = finalMembers;
      assignment.crewIds = [];
      assignment.notes = suggestion.type === 'reorganization'
        ? 'Réorganisation proposée par le moteur Ultra et validée par le dirigeant. Les dates Agenda Chantier sont inchangées.'
        : 'Affectation proposée par le moteur Ultra et validée par le dirigeant. Les dates proviennent de l’Agenda Chantier.';
      suggestion.status = 'approved';
      suggestion.reviewedAt = nowIso();
      suggestion.reviewedBy = state.session.activeMemberId;
      window.dispatchEvent(new CustomEvent('speedarti:team-planning:assignment-suggestion-approved', { detail: { suggestion, assignment } }));
    }, { action: 'assignment.suggestion.approved', entityType: 'suggestion', entityId: id });
    this.notify('Affectation validée sur l’intervention existante.');
  }

  rejectSuggestion(id) {
    this.store.update((state) => {
      const suggestion = state.suggestions.find((item) => item.id === id);
      if (suggestion) { suggestion.status = 'rejected'; suggestion.reviewedAt = nowIso(); suggestion.reviewedBy = state.session.activeMemberId; }
    }, { action: 'planning.suggestion.rejected', entityType: 'suggestion', entityId: id });
    this.notify('Suggestion refusée.', 'info');
  }

  markNotification(id) {
    this.store.update((state) => { const notification = state.notifications.find((item) => item.id === id); if (notification) notification.read = true; }, { action: 'notification.read', entityType: 'notification', entityId: id });
  }

  markAllRead() {
    this.store.update((state) => { state.notifications.forEach((notification) => { notification.read = true; }); }, { action: 'notifications.all_read', entityType: 'notification', entityId: 'all' });
    this.notify('Notifications marquées comme lues.');
  }

  setEdition(value) {
    if (!Object.prototype.hasOwnProperty.call(EDITION_LABELS, value)) return;
    this.store.update((state) => { state.settings.edition = value; }, { action: 'settings.edition.changed', entityType: 'settings', entityId: 'edition', details: value });
    this.notify(`Niveau ${EDITION_LABELS[value]} activé.`);
  }

  async downloadAttachmentFile(id) {
    try {
      if (!can(this.store.getState(), PERMISSIONS.DOWNLOAD_ATTACHMENTS)) throw new Error('Vous n’êtes pas autorisé à télécharger les documents.');
      await downloadAttachment(id);
    } catch (error) {
      this.notify(error instanceof Error ? error.message : 'Téléchargement impossible.', 'error');
    }
  }

  startDictation() {
    const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!Recognition) {
      this.notify('La dictée vocale n’est pas disponible dans ce navigateur.', 'error');
      return;
    }
    const textarea = document.querySelector('#report-summary');
    if (!textarea) return;
    const recognition = new Recognition();
    recognition.lang = 'fr-FR';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;
    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript;
      textarea.value = `${textarea.value}${textarea.value ? ' ' : ''}${transcript}`;
      this.notify('Dictée ajoutée au rapport.');
    };
    recognition.onerror = () => this.notify('La dictée vocale a échoué.', 'error');
    recognition.start();
  }

  async exportData() {
    try {
      const bundle = {
        bundleVersion: 1,
        exportedAt: nowIso(),
        state: JSON.parse(this.store.exportJson()),
        files: await exportAttachments(),
      };
      const blob = new Blob([JSON.stringify(bundle, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement('a');
      anchor.href = url;
      anchor.download = `speedarti-equipe-planning-${new Date().toISOString().slice(0, 10)}.json`;
      anchor.click();
      URL.revokeObjectURL(url);
      this.notify('Export complet créé, fichiers inclus.');
    } catch (error) {
      this.notify(error instanceof Error ? error.message : 'Export impossible.', 'error');
    }
  }

  async importData(file) {
    if (!file) return;
    try {
      const raw = await file.text();
      const parsed = JSON.parse(raw);
      if (parsed.bundleVersion === 1 && parsed.state) {
        await importAttachments(parsed.files ?? []);
        this.store.importJson(JSON.stringify(parsed.state));
      } else {
        this.store.importJson(raw);
      }
      this.notify('Données et fichiers importés.');
    } catch (error) {
      this.notify(error instanceof Error ? error.message : 'Import impossible.', 'error');
    }
  }

  resetData() {
    if (!confirm('Réinitialiser toutes les données locales avec la démonstration ?')) return;
    this.store.reset();
    this.view = 'dashboard';
    this.notify('Données réinitialisées.', 'info');
  }
}
